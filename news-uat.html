<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>News Intelligence · UAT · JP Trust Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=DM+Serif+Display&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#FAF6ED;--cream-card:#FFFEF8;--cream-warm:#F5EFE0;--cream-deep:#EDE4D0;
  --burgundy:#722F37;--burgundy-mid:#8B3A45;--burgundy-dark:#1a0a0e;
  --gold:#D4AF37;--gold-dark:#B8860B;--gold-deep:#8B6914;--gold-light:#F4E4BA;
  --text-dark:#3D3228;--text-dark-sub:#5A3D20;--text-dark-muted:#7A6F62;
  --text-light:#FFF5E1;
  --green:#2E7D32;--green-light:#4CAF50;--red:#C62828;--orange:#D97706;--blue:#1976D2;
  --border-gold:rgba(212,175,55,0.32);
  --border-gold-soft:rgba(212,175,55,0.18);
}
html,body{font-family:'Anuphan','Sarabun',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;-webkit-font-smoothing:antialiased}
body{padding:0 0 100px;max-width:480px;margin:0 auto;position:relative}

/* ===== TOPBAR ===== */
.topbar{background:linear-gradient(180deg,var(--cream) 0%,var(--cream) 78%,rgba(250,246,237,0.85) 100%);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 14px rgba(114,47,55,0.04);position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:14px;font-weight:700;color:#fff;box-shadow:0 3px 10px rgba(212,175,55,0.3)}
.greeting{font-size:12px;color:var(--text-dark-muted)}
.user-name{font-size:16px;font-weight:700;background:linear-gradient(135deg,#8B2A35 0%,#C4526A 35%,#D4AF37 65%,#F4E4BA 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.3px}
.topbar-right{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,254,248,0.7);border:1px solid var(--border-gold-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.icon-btn svg{width:20px;height:20px;color:var(--gold-deep);stroke:var(--gold-deep);fill:none;stroke-width:1.8}
.notif-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--gold);border-radius:50%;border:2px solid var(--cream-card)}

.page{padding:18px 16px 24px}

/* ===== HEADER ===== */
.news-hdr{margin-bottom:16px}
.news-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.spark-icon{width:18px;height:18px;color:var(--gold-dark);flex-shrink:0}
.news-title{font-family:'Cinzel',serif;font-size:1.3rem;font-weight:700;color:var(--burgundy);letter-spacing:0.18em;text-transform:uppercase}
.news-sub{font-family:'Anuphan',sans-serif;font-size:0.82rem;color:var(--text-dark-muted);letter-spacing:0.2px;margin-left:28px}

/* ===== SEARCH ===== */
.search{background:var(--cream-card);border:1px solid var(--border-gold);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;margin:14px 0 14px;box-shadow:0 1px 3px rgba(114,47,55,0.04);transition:all .2s}
.search:focus-within{border-color:var(--gold);box-shadow:0 2px 12px rgba(212,175,55,0.18)}
.search svg{flex-shrink:0;color:var(--gold-deep);stroke:var(--gold-deep);fill:none;stroke-width:2}
.search-i{width:17px;height:17px}
.search-f{width:18px;height:18px}
.search input{flex:1;border:none;outline:none;background:transparent;font-family:'Anuphan',sans-serif;font-size:13px;color:var(--text-dark)}
.search input::placeholder{color:var(--text-dark-muted)}

/* ===== FILTER PILLS ===== */
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 4px;margin:0 -16px 18px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:8px 16px;border-radius:20px;background:var(--cream-card);border:1px solid var(--border-gold-soft);font-family:'Anuphan',sans-serif;font-size:12px;font-weight:500;color:var(--text-dark-sub);cursor:pointer;transition:all .2s;white-space:nowrap;letter-spacing:0.2px}
.pill:hover{background:var(--cream-warm)}
.pill.active{background:linear-gradient(135deg,var(--burgundy),var(--burgundy-mid));color:var(--text-light);border-color:var(--burgundy);box-shadow:0 2px 8px rgba(114,47,55,0.25)}

/* ===== SECTION HEAD ===== */
.sect-hd{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px}
.sect-label{font-family:'Cinzel',serif;font-size:11px;font-weight:600;color:var(--gold-deep);letter-spacing:0.32em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sect-label::before{content:'';width:3px;height:14px;background:linear-gradient(180deg,var(--gold),var(--gold-dark));border-radius:2px}
.sect-link{font-family:'Anuphan',sans-serif;font-size:12px;color:var(--gold-deep);font-weight:500;cursor:pointer}

/* ===== STORY CARD — DARK BURGUNDY · BLACK · GOLD SHEEN ===== */
.story{position:relative;display:flex;gap:12px;background:linear-gradient(135deg,#3a141d 0%,#4a1923 28%,#2a0e15 60%,#160709 100%);border:1px solid rgba(212,175,55,0.22);border-radius:14px;padding:14px 14px 14px 18px;margin-bottom:10px;overflow:hidden;box-shadow:0 4px 14px rgba(26,10,14,0.28),inset 0 1px 0 rgba(244,228,186,0.05);transition:all .25s;cursor:pointer}
.story::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 100% 0%,rgba(212,175,55,0.13) 0%,transparent 38%),linear-gradient(135deg,transparent 0%,transparent 65%,rgba(244,228,186,0.04) 100%)}
.story:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(26,10,14,0.4),inset 0 1px 0 rgba(244,228,186,0.08);border-color:rgba(212,175,55,0.4)}
.story::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#F4E4BA 0%,#D4AF37 50%,#8B6914 100%);z-index:2}
.story-rank{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(212,175,55,0.55);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:12px;font-weight:600;color:#F4E4BA;background:rgba(212,175,55,0.10);align-self:flex-start;margin-top:2px;position:relative;z-index:1}
.story-body{flex:1;min-width:0;position:relative;z-index:1}
.story-title{font-family:'Sarabun','Anuphan',sans-serif;font-size:13.5px;font-weight:400;color:#F4E4BA;line-height:1.5;margin-bottom:9px;padding-right:22px;letter-spacing:0.1px}
.story-tags{display:flex;flex-wrap:wrap;gap:4px}
.story-tag{padding:2px 8px;border-radius:6px;font-family:'Sarabun','Anuphan',sans-serif;font-size:10px;font-weight:500;letter-spacing:0.4px;border:1px solid}
.story-tag.positive{color:#6FD774;background:rgba(46,125,50,0.20);border-color:rgba(111,215,116,0.42)}
.story-tag.negative{color:#FF8484;background:rgba(198,40,40,0.22);border-color:rgba(255,132,132,0.42)}
.story-tag.neutral{color:#F4E4BA;background:rgba(212,175,55,0.12);border-color:rgba(212,175,55,0.32)}
.story-meta{flex-shrink:0;width:84px;display:flex;flex-direction:column;justify-content:center;gap:7px;padding-left:11px;border-left:1px dashed rgba(212,175,55,0.28);font-family:'Sarabun','Anuphan',sans-serif;position:relative;z-index:1}
.story-meta-time{font-size:10.5px;color:rgba(244,228,186,0.62);line-height:1.45;font-weight:400}
.story-meta-time .src{display:block;color:rgba(212,175,55,0.78);font-weight:400;margin-top:2px;font-size:10px}
.story-meta-impact{display:flex;flex-direction:column;gap:2px;padding-top:5px;border-top:1px dashed rgba(212,175,55,0.18)}
.story-meta-impact-label{font-family:'Cinzel',serif;font-size:8px;font-weight:500;color:rgba(244,228,186,0.5);letter-spacing:1.2px;text-transform:uppercase}
.story-meta-impact-value{font-family:'Sarabun','Anuphan',sans-serif;font-size:11.5px;font-weight:500;letter-spacing:0.3px}
.story-meta-impact-value.bullish{color:#6FD774}
.story-meta-impact-value.bearish{color:#FF8484}
.story-meta-impact-value.neutral{color:#F4E4BA}
.story-bm{position:absolute;top:12px;right:12px;width:14px;height:16px;color:#D4AF37;opacity:0.55;cursor:pointer;transition:opacity .2s;z-index:2}
.story-bm:hover{opacity:0.95}
.story-bm svg{width:14px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* ===== MARKET MOVERS ===== */
.movers{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none;min-height:100px}
.movers::-webkit-scrollbar{display:none}
.mover{flex-shrink:0;width:130px;background:var(--cream-card);border:1px solid var(--border-gold-soft);border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(114,47,55,0.04);cursor:pointer;transition:all .2s}
.mover:hover{box-shadow:0 4px 12px rgba(114,47,55,0.08);transform:translateY(-1px)}
.mover-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.mover-tk{font-family:'Cinzel',serif;font-size:12px;font-weight:700;color:var(--text-dark);letter-spacing:0.6px}
.mover-arrow{width:20px;height:20px;border-radius:50%;background:rgba(46,125,50,0.13);display:flex;align-items:center;justify-content:center;color:var(--green)}
.mover-arrow svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.mover-arrow.dn{background:rgba(198,40,40,0.13);color:var(--red)}
.mover-status{font-family:'Anuphan',sans-serif;font-size:10.5px;color:var(--text-dark-muted);margin-bottom:3px}
.mover-pct{font-family:'DM Serif Display',serif;font-size:18px;color:var(--green);font-weight:400;margin-bottom:6px;line-height:1;letter-spacing:0.3px}
.mover-pct.dn{color:var(--red)}
.mover-spark{width:100%;height:24px;display:block}
.mover.skel .mover-pct,.mover.skel .mover-status{opacity:0.3}

/* ===== AI INSIGHT ===== */
.ai-card{background:linear-gradient(135deg,var(--cream-card) 0%,var(--cream-warm) 100%);border:1px solid var(--border-gold);border-radius:14px;padding:14px 16px;margin-top:18px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 8px rgba(114,47,55,0.05);position:relative;overflow:hidden}
.ai-card::before{content:'';position:absolute;top:-25px;right:-25px;width:90px;height:90px;background:radial-gradient(circle,rgba(212,175,55,0.2) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.ai-icon{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--burgundy),var(--burgundy-mid));display:flex;align-items:center;justify-content:center;color:var(--gold-light);position:relative;z-index:1;box-shadow:0 3px 10px rgba(114,47,55,0.25)}
.ai-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ai-body{flex:1;position:relative;z-index:1;min-width:0}
.ai-label{font-family:'Cinzel',serif;font-size:9.5px;font-weight:600;color:var(--gold-deep);letter-spacing:0.32em;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ai-label-dot{width:5px;height:5px;background:var(--gold);border-radius:50%;box-shadow:0 0 4px rgba(212,175,55,0.6)}
.ai-text{font-family:'Anuphan',sans-serif;font-size:12px;color:var(--text-dark);line-height:1.6;margin-bottom:10px}
.ai-cta{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:var(--cream);border:1px solid var(--border-gold);font-family:'Anuphan',sans-serif;font-size:11px;font-weight:500;color:var(--gold-deep);cursor:pointer;transition:all .2s}
.ai-cta:hover{background:var(--cream-card);border-color:var(--gold);color:var(--gold-dark)}

/* ===== LOADING ===== */
.loading{padding:30px 0;text-align:center;color:var(--text-dark-muted);font-size:12px;font-style:italic}
.loading-row{display:flex;align-items:center;justify-content:center;gap:8px}
.spinner{width:16px;height:16px;border:2px solid var(--border-gold-soft);border-top-color:var(--gold-dark);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== BOTTOM NAV ===== */
.bottom-nav{position:fixed;bottom:12px;left:16px;right:16px;max-width:448px;margin:0 auto;background:linear-gradient(135deg,var(--burgundy-dark),#2d1018);border:1px solid rgba(212,175,55,0.15);border-radius:28px;display:flex;justify-content:space-around;padding:10px 8px;z-index:1000;box-shadow:0 8px 32px rgba(26,10,14,0.4),0 0 0 1px rgba(212,175,55,0.08)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;cursor:pointer;color:rgba(244,228,186,0.55);transition:color .2s;font-family:'Anuphan',sans-serif;font-size:10px;font-weight:500;position:relative}
.nav-item.active{color:var(--gold)}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-owl{position:relative;width:46px;height:46px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--gold);transform:translateY(-2px)}
.nav-owl svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.5}

/* ===== UAT BADGE ===== */
.uat-badge{position:fixed;top:12px;right:12px;background:rgba(114,47,55,0.92);color:var(--gold-light);padding:4px 10px;border-radius:999px;font-family:'Cinzel',serif;font-size:9px;font-weight:600;letter-spacing:1.5px;z-index:9999;box-shadow:0 2px 10px rgba(114,47,55,0.3)}

@media(max-width:380px){
  .news-title{font-size:1.2rem}
  .story-meta{width:74px;padding-left:9px}
  .story-title{font-size:13px}
  .story-meta-time{font-size:10px}
}
</style>
</head>
<body>

<header class="topbar">

    <div class="icon-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>

<main class="page">

    <div class="news-eyebrow">

</main>

  <div class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/><circle cx="5" cy="12" r="1.5" fill="currentColor"/></svg>More</div>

<script>
'use strict';

const NEWS_INDEX_URL = 'https://raw.githubusercontent.com/jptrustlearning/pages/main/news/news-index.json';
const NEWS_BASE      = 'https://raw.githubusercontent.com/jptrustlearning/pages/main/news/';
const SP500_CSV_URL  = 'https://raw.githubusercontent.com/jptrustlearning/sp500/main/input_sp500_daily.csv';

// ==== Helpers ====

// Convention from NEWS-UPDATE-INSTRUCTION.md: batch dates use 'Z' suffix
// but the time written is Thai local (UTC+7), not actual UTC. Convert Z
// to +07:00 so the Date object lands at the real moment of publication.
function parseBatchDate(iso) {
  if (!iso || typeof iso !== 'string') return null;
  let s = iso;
  if (s.endsWith('Z')) s = s.slice(0, -1) + '+07:00';
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

const _MONTHS_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function shortDate(d) {
  return d.getDate() + ' ' + _MONTHS_TH[d.getMonth()];
}

function timeAgo(iso) {
  const d = parseBatchDate(iso);
  if (!d) return '';
  const diffMs = Date.now() - d.getTime();
  // Future date or sub-minute (treat as fresh) — show date instead of bogus "1m ago"
  if (diffMs < 0) return shortDate(d);
  const diffM = diffMs / 60000;
  if (diffM < 1) return 'just now';
  if (diffM < 60) return Math.floor(diffM) + 'm ago';
  const diffH = diffMs / 3600000;
  if (diffH < 24) return Math.floor(diffH) + 'h ago';
  const diffD = diffH / 24;
  if (diffD < 7) return Math.floor(diffD) + 'd ago';
  return shortDate(d);
}

function shortSource(s) {
  if (!s) return '';
  return s.split(/[,;·]/)[0].trim();
}

// Sentiment majority → derive accent + impact + confidence
function deriveTone(tickers) {
  if (!tickers || !tickers.length) {
    return {accent: 'neutral', impactText: 'Neutral', impactClass: 'neutral', confText: 'Low', confClass: 'low', dots: 1};
  }
  const counts = {positive:0, negative:0, neutral:0};
  for (const t of tickers) counts[t.sentiment] = (counts[t.sentiment]||0) + 1;
  const total = tickers.length;
  const pos = counts.positive, neg = counts.negative;
  const sentTickers = pos + neg;
  const dominantPct = sentTickers > 0 ? Math.max(pos, neg) / sentTickers : 0;

  let accent, impactText, impactClass;
  if (pos > neg && pos >= sentTickers * 0.7) {
    accent = 'bullish'; impactText = 'Bullish'; impactClass = 'bullish';
  } else if (neg > pos && neg >= sentTickers * 0.7) {
    accent = 'bearish'; impactText = 'Bearish'; impactClass = 'bearish';
  } else {
    accent = 'neutral'; impactText = 'Mixed'; impactClass = 'neutral';
  }

  let confText, confClass, dots;
  if (sentTickers === 0) { confText = 'Low'; confClass = 'low'; dots = 1; }
  else if (dominantPct >= 0.85) { confText = 'High'; confClass = 'high'; dots = 5; }
  else if (dominantPct >= 0.65) { confText = 'Medium'; confClass = 'medium'; dots = 3; }
  else { confText = 'Low'; confClass = 'low'; dots = 1; }

  return {accent, impactText, impactClass, confText, confClass, dots};
}

// ==== Open news detail ====
function openDetail(file, origIdx) {
  if (!file) return;
  let url = 'news-detail.html?file=' + encodeURIComponent(file);
  if (typeof origIdx === 'number' && origIdx >= 0) url += '&idx=' + origIdx;
  // If we're inside member-dashboard's iframe, navigate parent through openIframe;
  // otherwise navigate this window directly.
  try {
    if (window.parent && window.parent !== window && typeof window.parent.openNewsDetail === 'function') {
      window.parent.openNewsDetail(file, origIdx);
      return;
    }
  } catch (e) { /* cross-origin guard */ }
  window.location.href = url;
}

// ==== Render: Top Stories ====
function renderTopStories(headlines) {
  const root = document.getElementById('topStories');
  root.innerHTML = '';
  headlines.forEach((h, i) => {
    const tone = deriveTone(h.tickers);
    const tagsHtml = (h.tickers || []).slice(0, 5).map(t =>
      `<span class="story-tag ${t.sentiment}">${t.symbol}</span>`
    ).join('');
    const sourceShort = shortSource(h.source);
    const time = timeAgo(h.batchDate);
    const card = document.createElement('article');
    card.className = 'story ' + tone.accent;
    card.dataset.idx = i;
    card.onclick = () => openDetail(h.batchFile, h.origIdx);
    card.innerHTML = `
      <svg class="story-bm" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <div class="story-rank r-${tone.accent}">${i + 1}</div>
      <div class="story-body">
        <div class="story-title">${escapeHtml(h.title)}</div>
        <div class="story-tags">${tagsHtml}</div>
      </div>
      <div class="story-meta">
        <div class="story-meta-time">${time}<span class="src">${escapeHtml(sourceShort)}</span></div>
        <div class="story-meta-impact">
          <span class="story-meta-impact-label">Impact</span>
          <span class="story-meta-impact-value ${tone.impactClass}">${tone.impactText}</span>
        </div>
      </div>`;
    root.appendChild(card);
  });
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
}

// ==== Render: Movers ====
function renderMoversSkeleton(n) {
  const root = document.getElementById('movers');
  root.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const card = document.createElement('div');
    card.className = 'mover skel';
    card.innerHTML = `
      <div class="mover-hd"><span class="mover-tk">···</span><span class="mover-arrow"></span></div>
      <div class="mover-status">กำลังโหลด</div>
      <div class="mover-pct">···</div>
      <svg class="mover-spark" viewBox="0 0 100 24"></svg>`;
    root.appendChild(card);
  }
}

function renderMovers(items) {
  const root = document.getElementById('movers');
  root.innerHTML = '';
  if (!items.length) {
    root.innerHTML = '<div class="loading" style="margin:0 auto">ไม่พบราคาของ ticker ในข่าวล่าสุดที่ตรงกับ S&amp;P 500 dataset</div>';
    return;
  }
  items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'mover';
    const dn = it.pctChange < 0;
    const arrowSvg = dn
      ? '<svg viewBox="0 0 24 24"><polyline points="6 14 12 20 18 14"/><line x1="12" y1="20" x2="12" y2="4"/></svg>'
      : '<svg viewBox="0 0 24 24"><polyline points="18 10 12 4 6 10"/><line x1="12" y1="4" x2="12" y2="20"/></svg>';
    const pctStr = (dn ? '' : '+') + it.pctChange.toFixed(2) + '%';
    card.innerHTML = `
      <div class="mover-hd">
        <span class="mover-tk">${escapeHtml(it.symbol)}</span>
        <span class="mover-arrow ${dn ? 'dn' : ''}">${arrowSvg}</span>
      </div>
      <div class="mover-status">${escapeHtml(it.statusLabel)}</div>
      <div class="mover-pct ${dn ? 'dn' : ''}">${pctStr}</div>
      <svg class="mover-spark" viewBox="0 0 100 24" preserveAspectRatio="none">
        <polyline points="${it.sparkPoints}" fill="none" stroke="${dn ? '#C62828' : '#2E7D32'}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>`;
    root.appendChild(card);
  });
}

// Sentiment → status label
function statusLabel(sentiment, pctChange) {
  if (sentiment === 'positive') return pctChange >= 5 ? 'Breakout' : 'Bullish';
  if (sentiment === 'negative') return pctChange <= -5 ? 'Breakdown' : 'Bearish';
  return Math.abs(pctChange) >= 3 ? 'Momentum' : 'Watch';
}

// Build sparkline path from prices (last N closes)
function makeSparkPoints(closes) {
  if (!closes || closes.length < 2) return '0,12 100,12';
  const n = closes.length;
  const min = Math.min(...closes);
  const max = Math.max(...closes);
  const range = max - min || 1;
  return closes.map((c, i) => {
    const x = (i / (n - 1)) * 100;
    const y = 22 - ((c - min) / range) * 20; // top padding 2, bottom padding 2
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
}

// Parse SP500 CSV → group by ticker (only those we want), keep last N closes
function parseSP500ForTickers(csvText, wantedSet, maxDays = 15) {
  const parsed = window.Papa.parse(csvText.trim(), { header: true, skipEmptyLines: true });
  const rows = parsed.data;
  const tmp = {};
  rows.forEach(row => {
    const tk = (row.Ticker || '').trim();
    if (!wantedSet.has(tk)) return;
    const d = (row.Date || '').trim();
    const c = parseFloat(row.Close);
    if (!d || !isFinite(c) || c <= 0) return;
    if (!tmp[tk]) tmp[tk] = [];
    tmp[tk].push({ d, c });
  });
  const out = {};
  for (const tk in tmp) {
    tmp[tk].sort((a, b) => a.d < b.d ? -1 : 1);
    out[tk] = tmp[tk].slice(-maxDays);
  }
  return out;
}

// ==== Render: AI Insight ====
function renderAiInsight(latestBatch) {
  const root = document.getElementById('aiInsight');
  if (!latestBatch) { root.innerHTML = ''; return; }
  // Aggregate sentiment from all headlines in the batch
  let pos = 0, neg = 0, neu = 0;
  const themes = new Set();
  for (const h of latestBatch.headlines) {
    for (const t of (h.tickers || [])) {
      if (t.sentiment === 'positive') pos++;
      else if (t.sentiment === 'negative') neg++;
      else neu++;
    }
  }
  const total = pos + neg + neu;
  const tilt = pos > neg ? 'เชิงบวก' : neg > pos ? 'เชิงลบ' : 'ผสม';
  const summary = latestBatch.summary || '';
  const text = summary
    ? `${escapeHtml(summary)} · โทนตลาดโดยรวม${tilt} (${pos} positive · ${neg} negative · ${neu} neutral จาก ${total} tickers)`
    : `Batch ล่าสุดมี ${latestBatch.headlines.length} headlines · โทนรวม${tilt} (${pos} positive · ${neg} negative · ${neu} neutral)`;
  root.innerHTML = `
    <div class="ai-card">
      <div class="ai-icon">
        <svg viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 0 7 4.5v.05A3 3 0 0 0 5 7.5v.5a3 3 0 0 0 1 2.236V13a3 3 0 0 0 1.5 2.6V18a2.5 2.5 0 0 0 2.5 2.5H10A1 1 0 0 0 11 22V12.5A2.5 2.5 0 0 1 13.5 10H14"/><path d="M14.5 2A2.5 2.5 0 0 1 17 4.5v.05A3 3 0 0 1 19 7.5v.5a3 3 0 0 1-1 2.236V13a3 3 0 0 1-1.5 2.6V18a2.5 2.5 0 0 1-2.5 2.5H14A1 1 0 0 1 13 22V12.5A2.5 2.5 0 0 0 10.5 10H10"/></svg>
      </div>
      <div class="ai-body">
        <div class="ai-label"><span class="ai-label-dot"></span> AI Insight</div>
        <div class="ai-text">${text}</div>
        <button class="ai-cta">ดูรายละเอียด ›</button>
      </div>
    </div>`;
}

// ==== Init ====
async function init() {
  let idx;
  try {
    const resp = await fetch(NEWS_INDEX_URL + '?t=' + Date.now(), { cache: 'no-store' });
    idx = await resp.json();
  } catch (e) {
    document.getElementById('topStories').innerHTML = '<div class="loading">โหลด news-index.json ไม่สำเร็จ</div>';
    return;
  }
  if (!idx.batches || !idx.batches.length) {
    document.getElementById('topStories').innerHTML = '<div class="loading">ไม่พบ batches</div>';
    return;
  }

  // Pick top 5 headlines from latest batches
  const headlines = [];
  for (const b of idx.batches) {
    for (let hi = 0; hi < b.headlines.length; hi++) {
      headlines.push({ ...b.headlines[hi], batchFile: b.file, batchDate: b.date, origIdx: hi });
      if (headlines.length >= 5) break;
    }
    if (headlines.length >= 5) break;
  }

  // Render stories (no .md fetch needed — summary removed)
  renderTopStories(headlines);

  // AI Insight from latest batch
  renderAiInsight(idx.batches[0]);

  // Movers — collect tickers from latest 2 batches
  const tkSeen = new Set();
  const tkOrdered = [];
  for (const b of idx.batches.slice(0, 2)) {
    for (const h of b.headlines) {
      for (const t of (h.tickers || [])) {
        if (!tkSeen.has(t.symbol)) {
          tkSeen.add(t.symbol);
          tkOrdered.push(t);
        }
      }
    }
  }

  renderMoversSkeleton(Math.min(5, tkOrdered.length || 3));

  // Fetch SP500 CSV
  let prices;
  try {
    const r = await fetch(SP500_CSV_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('CSV ' + r.status);
    const csv = await r.text();
    prices = parseSP500ForTickers(csv, tkSeen, 12);
  } catch (e) {
    document.getElementById('movers').innerHTML = '<div class="loading">โหลดราคา SP500 ไม่สำเร็จ</div>';
    return;
  }

  // Build movers list — only tickers with price data
  const moverItems = [];
  for (const t of tkOrdered) {
    const p = prices[t.symbol];
    if (!p || p.length < 2) continue;
    const closes = p.map(x => x.c);
    const first = closes[0], last = closes[closes.length - 1];
    const pct = ((last - first) / first) * 100;
    moverItems.push({
      symbol: t.symbol,
      sentiment: t.sentiment,
      pctChange: pct,
      statusLabel: statusLabel(t.sentiment, pct),
      sparkPoints: makeSparkPoints(closes),
    });
    if (moverItems.length >= 5) break;
  }
  renderMovers(moverItems);
}

document.addEventListener('DOMContentLoaded', init);
</script>
