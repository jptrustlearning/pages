<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { background:#1a0a0e; font-family:'Anuphan',sans-serif; color:#FAF6ED;
         display:flex; flex-direction:column; }

  /* ── header ── */
  .hdr { padding:14px 16px 6px; flex:0 0 auto; }
  .hdr .eyebrow { font-family:'Cinzel',serif; font-size:10px; letter-spacing:3px;
                  color:#D4AF37; text-transform:uppercase; }
  .hdr h1 { font-size:20px; font-weight:600; margin-top:2px; color:#FAF6ED; }

  .searchbar { margin:8px 16px 0; display:flex; align-items:center; gap:9px;
               background:#2d1018; border:1px solid #4a2028; border-radius:12px;
               padding:9px 13px; transition:border-color .25s, box-shadow .25s; flex:0 0 auto; }
  .searchbar.active { border-color:#D4AF37; box-shadow:0 0 14px rgba(212,175,55,.18); }
  .searchbar svg { flex:0 0 auto; }
  .searchbar input { flex:1; background:none; border:none; outline:none; color:#F4E4BA;
                     font-family:'Anuphan',sans-serif; font-size:15px; min-width:0; }
  .searchbar input::placeholder { color:#7a5a60; }
  .searchbar .hits { font-size:11px; color:#8a6d6f; white-space:nowrap; }
  .searchbar .clear { display:none; color:#b89aa0; font-size:16px; line-height:1;
                      padding:2px 4px; cursor:pointer; }
  .searchbar.active .clear { display:block; }

  .legend { display:flex; gap:6px; overflow-x:auto; padding:9px 16px 7px;
            scrollbar-width:none; flex:0 0 auto; }
  .legend::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; display:flex; align-items:center; gap:6px; font-size:11.5px;
          color:#c9a8ae; background:#2d1018; border:1px solid #3f1c26; border-radius:999px;
          padding:5px 11px; cursor:pointer; user-select:none; transition:all .2s; }
  .chip .dot { width:8px; height:8px; border-radius:50%; }
  .chip.on { color:#1a0a0e; background:#F4E4BA; border-color:#D4AF37; font-weight:600; }

  /* ── graph stage ── */
  .stage { position:relative; flex:1 1 auto; overflow:hidden; touch-action:none;
           background:radial-gradient(circle at 50% 30%, #241016 0%, #1a0a0e 60%); }
  .stage svg { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  .stage svg.dragging { cursor:grabbing; }

  .edge { stroke:#5a3630; stroke-width:1.1; opacity:.4; transition:opacity .25s, stroke .25s; }
  .edge.lit { stroke:#D4AF37; stroke-width:1.8; opacity:.9; }
  .edge.dim { opacity:.05; }

  .node { cursor:pointer; }
  .node circle { fill:#2d1018; stroke-width:1.6; transition:opacity .25s, filter .25s; }
  .node text { font-family:'Anuphan',sans-serif; font-weight:600; fill:#d8c2c7;
               text-anchor:middle; pointer-events:none; transition:opacity .25s;
               paint-order:stroke; stroke:#1a0a0e; stroke-width:3px; stroke-linejoin:round; }
  .node.dim circle { opacity:.1; }
  .node.dim text { opacity:.08; }
  .node.hit circle { filter:drop-shadow(0 0 10px rgba(212,175,55,.75)); }
  .node.hit text { fill:#F4E4BA; }
  .node.near circle { filter:drop-shadow(0 0 5px rgba(212,175,55,.35)); }
  .node.near text { fill:#e0c98a; }
  .node.sel circle { stroke:#F4E4BA !important; stroke-width:2.6;
                     filter:drop-shadow(0 0 14px rgba(212,175,55,.9)); }

  /* ── controls ── */
  .zoomctl { position:absolute; right:12px; bottom:16px; display:flex; flex-direction:column;
             gap:7px; z-index:5; }
  .zoomctl button { width:38px; height:38px; border-radius:11px; background:#2d1018;
                    border:1px solid #4a2028; color:#D4AF37; font-size:18px; cursor:pointer;
                    display:flex; align-items:center; justify-content:center;
                    font-family:'Anuphan',sans-serif; }
  .zoomctl button:active { background:#3a1520; }
  .hint { position:absolute; left:14px; bottom:18px; font-size:10.5px; color:#6f545a;
          line-height:1.6; z-index:5; pointer-events:none; }

  /* ── detail sheet ── */
  .sheet { position:fixed; left:0; right:0; bottom:0; background:#FAF6ED;
           border-radius:18px 18px 0 0; padding:16px 18px calc(18px + env(safe-area-inset-bottom));
           transform:translateY(105%); transition:transform .3s cubic-bezier(.3,.9,.35,1);
           z-index:20; max-height:62vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.5); }
  .sheet.open { transform:translateY(0); }
  .sheet .grab { width:38px; height:4px; border-radius:2px; background:#d5c9b6; margin:0 auto 12px; }
  .sheet .cattag { display:inline-flex; align-items:center; gap:6px;
                   font-family:'Cinzel',serif; font-size:9px; letter-spacing:2px;
                   color:#6a5a2a; font-weight:700; text-transform:uppercase; }
  .sheet .cattag .dot { width:8px; height:8px; border-radius:50%; }
  .sheet .badge { display:inline-block; margin-left:8px; font-size:9px; letter-spacing:1.5px;
                  font-weight:700; color:#8a3a1a; background:#f5e2cc; border:1px solid #e0b98a;
                  border-radius:6px; padding:2px 7px; vertical-align:1px; }
  .sheet h2 { font-size:19px; color:#1a0a0e; font-weight:700; margin-top:4px; }
  .sheet .desc { font-size:13.5px; color:#3f3236; line-height:1.65; margin-top:7px; }
  .sheet ul { margin:9px 0 0 2px; list-style:none; }
  .sheet li { font-size:12.5px; color:#5a4a4e; line-height:1.55; padding-left:16px;
              position:relative; margin-top:5px; }
  .sheet li::before { content:''; position:absolute; left:2px; top:8px; width:6px; height:6px;
                      border-radius:50%; background:#D4AF37; }
  .sheet .actions { display:flex; gap:9px; margin-top:14px; }
  .sheet .go { flex:1; text-align:center; font-size:13.5px; font-weight:600; padding:11px 0;
               border-radius:11px; background:linear-gradient(135deg,#D4AF37,#b8952c);
               color:#1a0a0e; text-decoration:none; }
  .sheet .rel-h { font-family:'Cinzel',serif; font-size:9px; letter-spacing:2px; color:#8a7a6e;
                  font-weight:700; margin-top:15px; }
  .sheet .rel { display:flex; flex-wrap:wrap; gap:7px; margin-top:7px; }
  .sheet .rel span { font-size:11.5px; color:#4a3238; background:#efe7d6;
                     border:1px solid #ddd0b8; border-radius:999px; padding:5px 11px;
                     cursor:pointer; }
  .backdrop { position:fixed; inset:0; background:rgba(10,4,6,.35); opacity:0;
              pointer-events:none; transition:opacity .3s; z-index:15; }
  .backdrop.on { opacity:1; pointer-events:auto; }
</style>

<script>

,["sniper","mom"],["sniper","lab"],["btd","breadth"],["btd","defext"],["btd","lab"],["harvester","mr"],["harvester","lab"],["sectorlead","divers"],["sectorlead","btd"],["sectorlead","sniper"],["goldmom","lb6"],["goldmom","golddca"],["goldmom","lab"],["goldencross","tf"],["goldencross","golddca"],["goldencross","lab"],["goldzone","zscore"],["goldzone","golddca"],["goldzone","lab"],["goldswing","mr"],["goldswing","lab"],["zgrid","mr"],["zgrid","tf"],["zgrid","volfilter"],["zgrid","divers"],["vixladder","volfilter"],["scanner","mom"],["scanner","lab"],["port","risk"],["news","library"],["news","lab"],["macrofw","newsops"],["macrofw","news"],["macrofw","goldmom"],["newsops","news"],["fbsystem","newsops"],["fbsystem","edge6m"],["worklessons","handoffchain"],["worklessons","lab"],["worklessons","bt"],["handoffchain","pendingnode"],["handoffchain","infra"],["contentrules","edge6m"],["contentrules","sniper"],["contentrules","defext"],["contentrules","surviv"],["infra","lab"],["infra","port"],["infra","news"],["appguide","rolling"],["appguide","handoffchain"]],"cats":{"fnd":["ฐานราก","#A8B8C8"],"mech":["กลไก","#F4E4BA"],"ev":["หลักฐาน Edge","#5BC48E"],"eq":["หุ้นสหรัฐ","#D4AF37"],"gold":["ทองคำ","#E8973D"],"fx":["กริด & FX","#B784C7"],"tool":["เครื่องมือ","#7EA8D8"],"ops":["Ops ภายใน","#D77A8C"]}};

<script>
(function(){
'use strict';
const [WW, WH] = DATA.world;
const byId = {}; DATA.nodes.forEach(n => byId[n.id] = n);
const nbr = {}; DATA.nodes.forEach(n => nbr[n.id] = new Set());
DATA.edges.forEach(([a,b]) => { nbr[a].add(b); nbr[b].add(a); });

const svg = document.getElementById('svg');
const world = document.getElementById('world');
const gE = document.getElementById('edges');
const gN = document.getElementById('nodes');
const stage = document.getElementById('stage');

/* ── build SVG ── */
const edgeEls = DATA.edges.map(([a,b]) => {
  const A = byId[a], B = byId[b];
  const el = document.createElementNS('http://www.w3.org/2000/svg','line');
  el.setAttribute('x1',A.x); el.setAttribute('y1',A.y);
  el.setAttribute('x2',B.x); el.setAttribute('y2',B.y);
  el.setAttribute('class','edge'); el.dataset.a=a; el.dataset.b=b;
  gE.appendChild(el); return el;
});
const nodeEls = {};
DATA.nodes.forEach(n => {
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','node'); g.dataset.id = n.id;
  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',n.x); c.setAttribute('cy',n.y); c.setAttribute('r',n.size);
  c.setAttribute('stroke', DATA.cats[n.cat][1]);
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',n.x); t.setAttribute('y', n.y + n.size + 17);
  t.setAttribute('font-size', 13.5);
  t.textContent = n.title;
  g.appendChild(c); g.appendChild(t);
  gN.appendChild(g); nodeEls[n.id] = g;
});

/* ── legend chips ── */
const legend = document.getElementById('legend');
const catState = {};
Object.entries(DATA.cats).forEach(([k,[name,color]]) => {
  const ch = document.createElement('div');
  ch.className = 'chip'; ch.dataset.cat = k;
  ch.innerHTML = `<span class="dot" style="background:${color}"></span>${name}`;
  ch.addEventListener('click', () => {
    catState[k] = !catState[k];
    ch.classList.toggle('on', catState[k]);
    applyState();
  });
  legend.appendChild(ch);
});

/* ── view transform ── */
let vx=0, vy=0, vs=1;
function apply(){ world.setAttribute('transform',`translate(${vx},${vy}) scale(${vs})`); }
function fit(){
  const r = stage.getBoundingClientRect();
  vs = Math.min(r.width/WW, r.height/WH) * 0.96;
  vx = (r.width - WW*vs)/2; vy = (r.height - WH*vs)/2;
  apply();
}
function zoomAt(cx, cy, f){
  const ns = Math.min(4, Math.max(0.18, vs*f));
  vx = cx - (cx - vx) * (ns/vs); vy = cy - (cy - vy) * (ns/vs);
  vs = ns; apply();
}
window.addEventListener('resize', fit);
fit();

document.getElementById('zin').onclick = () => { const r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1.35); };
document.getElementById('zout').onclick = () => { const r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1/1.35); };
document.getElementById('zfit').onclick = fit;
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});

/* ── pointer pan / pinch / tap ── */
const pts = new Map();
let moved = 0, pinchD = 0;
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  moved = 0;
  if (pts.size === 2) {
    const [a,b] = [...pts.values()];
    pinchD = Math.hypot(a.x-b.x, a.y-b.y);
  }
  svg.classList.add('dragging');
});
svg.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const p = pts.get(e.pointerId);
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  moved += Math.abs(dx) + Math.abs(dy);
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 1) { vx += dx; vy += dy; apply(); }
  else if (pts.size === 2) {
    const [a,b] = [...pts.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const r = stage.getBoundingClientRect();
    const mx = (a.x+b.x)/2 - r.left, my = (a.y+b.y)/2 - r.top;
    if (pinchD > 0) zoomAt(mx, my, d/pinchD);
    pinchD = d;
  }
});
function endPt(e){
  pts.delete(e.pointerId);
  if (pts.size < 2) pinchD = 0;
  if (pts.size === 0) svg.classList.remove('dragging');
}
svg.addEventListener('pointerup', e => {
  if (pts.size === 1 && moved < 8) {
    const g = e.target.closest('.node');
    if (g) selectNode(g.dataset.id);
    else if (selected) { selected = null; closeSheet(); applyState(); }
  }
  endPt(e);
});
svg.addEventListener('pointercancel', endPt);

/* ── search + state machine ── */
const qInput = document.getElementById('q');
const hitsEl = document.getElementById('hits');
const searchbar = document.getElementById('searchbar');
let query = '', selected = null;

function matches(n, q){
  const hay = (n.title + ' ' + n.desc + ' ' + n.points.join(' ')).toLowerCase();
  return hay.includes(q);
}
function applyState(){
  const q = query.trim().toLowerCase();
  const activeCats = Object.keys(catState).filter(k => catState[k]);
  let hitSet = null;
  if (q) {
    hitSet = new Set(DATA.nodes.filter(n => matches(n,q)).map(n => n.id));
  }
  if (activeCats.length) {
    const catSet = new Set(DATA.nodes.filter(n => activeCats.includes(n.cat)).map(n => n.id));
    hitSet = hitSet ? new Set([...hitSet].filter(id => catSet.has(id))) : catSet;
  }
  if (selected) {
    hitSet = new Set([selected]);
  }
  hitsEl.textContent = (q && !selected) ? `เจอ ${hitSet ? hitSet.size : 0} node` : '';
  searchbar.classList.toggle('active', !!q);

  if (!hitSet) { /* neutral */
    DATA.nodes.forEach(n => nodeEls[n.id].setAttribute('class','node'));
    edgeEls.forEach(el => el.setAttribute('class','edge'));
    return;
  }
  const nearSet = new Set();
  hitSet.forEach(id => nbr[id].forEach(m => { if(!hitSet.has(m)) nearSet.add(m); }));
  DATA.nodes.forEach(n => {
    let cls = 'node dim';
    if (hitSet.has(n.id)) cls = 'node hit' + (n.id===selected ? ' sel' : '');
    else if (nearSet.has(n.id)) cls = 'node near';
    nodeEls[n.id].setAttribute('class', cls);
  });
  edgeEls.forEach(el => {
    const a = el.dataset.a, b = el.dataset.b;
    if (hitSet.has(a) || hitSet.has(b)) el.setAttribute('class','edge lit');
    else el.setAttribute('class','edge dim');
  });
}
qInput.addEventListener('input', () => { query = qInput.value; selected = null; closeSheet(); applyState(); });
document.getElementById('clearBtn').addEventListener('click', () => {
  qInput.value = ''; query = ''; selected = null; closeSheet(); applyState();
});

/* ── detail sheet ── */
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
function closeSheet(){ sheet.classList.remove('open'); backdrop.classList.remove('on'); }
backdrop.addEventListener('click', () => { selected = null; closeSheet(); applyState(); });

function selectNode(id){
  selected = id; applyState();
  const n = byId[id];
  const [catName, catColor] = DATA.cats[n.cat];
  document.getElementById('shCat').innerHTML =
    `<span class="dot" style="background:${catColor}"></span>${catName}`;
  document.getElementById('shBadge').style.display = n.badge ? 'inline-block' : 'none';
  document.getElementById('shTitle').textContent = n.title;
  document.getElementById('shDesc').textContent = n.desc;
  const ul = document.getElementById('shPoints');
  ul.innerHTML = '';
  n.points.forEach(p => { const li = document.createElement('li'); li.textContent = p; ul.appendChild(li); });
  const act = document.getElementById('shActions');
  act.innerHTML = '';
  if (n.link) {
    const a = document.createElement('a');
    a.className = 'go'; a.textContent = n.link[0] + ' ›'; a.href = n.link[1];
    act.appendChild(a);
  }
  const rel = document.getElementById('shRel');
  rel.innerHTML = '';
  [...nbr[id]].forEach(m => {
    const s = document.createElement('span');
    s.textContent = byId[m].title;
    s.addEventListener('click', () => selectNode(m));
    rel.appendChild(s);
  });
  sheet.classList.add('open'); backdrop.classList.add('on');
  /* pan selected node into upper-third view */
  const r = stage.getBoundingClientRect();
  vx = r.width/2 - n.x*vs; vy = r.height*0.32 - n.y*vs; apply();
}

/* ── deep link ?n=id ── */
const p = new URLSearchParams(location.search).get('n');
if (p && byId[p]) setTimeout(() => selectNode(p), 300);
})();
