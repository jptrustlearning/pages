<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>สมัครสมาชิกใหม่ · JP Trust Learning</title>
    <meta name="theme-color" content="#1a0a0e">
    <link rel="icon" type="image/png" href="jpt-owl-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@200;300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --burgundy:#722F37;--burgundy-dark:#1a0a0e;--burgundy-mid:#2d1018;--burgundy-light:#3a1520;
    --gold:#D4AF37;--gold-dark:#B8860B;--gold-deep:#8B6914;--gold-light:#F4E4BA;
    --gold-glow:rgba(212,175,55,0.15);--gold-border:rgba(212,175,55,0.2);
    --text-light:#E8E4DC;--text-light-muted:#A09B92;
    --radius-sm:12px;
    --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{font-family:'Sarabun','Anuphan',sans-serif;background:var(--burgundy-dark);color:var(--text-light);min-height:100vh;min-height:100dvh;overflow-x:hidden}

.entry-screen{position:fixed;inset:0;background:linear-gradient(160deg,var(--burgundy-dark),var(--burgundy-mid) 40%,var(--burgundy-light) 60%,var(--burgundy-mid) 80%,var(--burgundy-dark));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));overflow-y:auto}
.entry-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 28%,rgba(114,47,55,0.28),transparent 50%),radial-gradient(ellipse at 70% 64%,rgba(90,30,40,0.22),transparent 50%);pointer-events:none}

.entry-logo{width:104px;height:104px;border-radius:26px;display:flex;align-items:center;justify-content:center;margin-bottom:22px;position:relative;z-index:1;background:linear-gradient(135deg,var(--burgundy-dark),var(--burgundy));box-shadow:0 0 44px var(--gold-glow),0 0 0 1.5px rgba(212,175,55,0.4);animation:logoIn 1.1s cubic-bezier(.22,1,.36,1) both}
.entry-logo img{width:74px;height:74px;object-fit:contain}
.entry-logo .fallback{display:none;font-family:'Cinzel',serif;font-size:24px;font-weight:700;letter-spacing:2px;color:var(--gold)}
@keyframes logoIn{0%{opacity:0;transform:translateY(14px) scale(.86)}100%{opacity:1;transform:translateY(0) scale(1)}}

.entry-eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:4px;color:var(--gold-deep);text-transform:uppercase;margin-bottom:10px;position:relative;z-index:1;opacity:0;animation:fadeUp .7s ease .15s forwards}
.entry-title{font-family:'DM Serif Display',serif;font-size:27px;color:var(--gold-light);margin-bottom:10px;position:relative;z-index:1;text-align:center;opacity:0;animation:fadeUp .7s ease .25s forwards}
.entry-subtitle{color:var(--text-light-muted);font-size:14.5px;line-height:1.65;margin-bottom:30px;position:relative;z-index:1;text-align:center;max-width:340px;opacity:0;animation:fadeUp .7s ease .35s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.entry-form{width:100%;max-width:380px;display:flex;flex-direction:column;position:relative;z-index:1;opacity:0;animation:fadeUp .7s ease .45s forwards}
.entry-btn{padding:17px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border:none;border-radius:var(--radius-sm);color:#1a0a0e;font-family:'Sarabun','Anuphan',sans-serif;font-size:16.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(212,175,55,0.3);transition:transform .15s;display:flex;align-items:center;justify-content:center;gap:9px}
.entry-btn:active{transform:scale(.97)}
.entry-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

.entry-link{color:var(--text-light-muted);font-size:13.5px;text-align:center;margin-top:20px;cursor:pointer;position:relative;z-index:1;opacity:0;animation:fadeUp .7s ease .55s forwards}
.entry-link span{color:var(--gold);font-weight:500}
</style>
</head>
<body>

<div class="entry-screen">
    <div class="entry-logo">
        <img src="jpt-owl-logo.png" alt="JP Trust" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="fallback">JPT</span>
    </div>

    <div class="entry-eyebrow">JP Trust Learning</div>
    <div class="entry-title">สมัครสมาชิกใหม่</div>
    <div class="entry-subtitle">เริ่มต้นเข้าถึงกลยุทธ์การลงทุนและบทวิเคราะห์เชิงลึกของ JP Trust<br>กดปุ่มด้านล่างเพื่อเริ่มสมัครสมาชิก</div>

    <div class="entry-form">
        <button class="entry-btn" onclick="goSignup()">
            สมัครสมาชิก
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
    </div>

    <div class="entry-link" onclick="location.href='member-dashboard.html'">มีบัญชีอยู่แล้ว? <span>เข้าสู่ระบบ</span></div>
</div>

<script>
function goSignup(){ location.href = 'signup.html?v=1779590734'; }
</script>
</body>
</html>
