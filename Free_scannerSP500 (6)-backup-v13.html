
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP TRUST — S&P 500 Daily Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@200;300;400;500;600;700&family=Cinzel:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--font-thai:'Anuphan',sans-serif;--font-label:'Cinzel',serif;--font-number:'DM Serif Display',serif;--gold:#D4AF37;--gold-dark:#B8860B;--gold-light:#F4E4BA;--gold-dim:rgba(212,175,55,0.08);--maroon:#722F37;--maroon-darkest:#1a0a0e;--maroon-mid:#2d1018;--maroon-light:#3a1520;--cream:#FAF6ED;--cream-warm:#F5EFE0;--cream-deep:#EDE4D0;--cream-card:#FFFEF8;--text-dark:#3D3228;--text-heading:#5A3D20;--text-muted:#7A6F62;--text-light:#E8E4DC;--text-light-heading:#F4E4BA;--text-light-muted:#A09B92;--green:#4CAF50;--green-dark:#2E7D32;--red:#E53935;--border-gold:rgba(212,175,55,0.15)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-thai);color:var(--text-dark);background:var(--cream);line-height:1.7;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--cream-deep)}::-webkit-scrollbar-thumb{background:rgba(114,47,55,0.25);border-radius:3px}
.sec-dark{background:linear-gradient(160deg,#1a0a0e,#2d1018 25%,#3a1520 45%,#2d1018 65%,#1a0a0e);color:var(--text-light);position:relative}
.sec-dark::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 30%,rgba(114,47,55,0.25),transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(90,30,40,0.2),transparent 50%);pointer-events:none}
.gold-line{height:2px;background:linear-gradient(90deg,transparent,var(--gold),#E8D48B,var(--gold),transparent)}
.header-section{padding:50px 24px 40px;position:relative;z-index:2;text-align:center}
.header-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(212,175,55,0.05);border:1px solid rgba(212,175,55,0.2);border-radius:100px;padding:5px 18px;font-size:11px;color:#C4B88A;margin-bottom:20px;letter-spacing:3px;text-transform:uppercase;font-family:var(--font-label)}
.header-title{font-size:clamp(26px,4.5vw,48px);font-weight:600;line-height:1.25;margin-bottom:14px;background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-subtitle{font-size:15px;color:var(--text-light-muted);max-width:550px;margin:0 auto 20px;line-height:1.8}
.header-meta{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;font-size:0.75rem;color:var(--text-light-muted)}
.header-meta .logo{font-family:var(--font-label);font-size:0.65rem;letter-spacing:3px;color:var(--gold);border:1px solid rgba(212,175,55,0.2);padding:4px 14px;border-radius:4px}
.header-meta .date{font-family:var(--font-number);font-size:0.85rem}
.status-wrap{background:var(--cream);padding:16px 24px 8px}

/* TOP-LEVEL RANKING SECTION (above status chips) */
.ranking-wrap{background:var(--cream);padding:18px 24px 4px}
.ranking-inner{max-width:1400px;margin:0 auto;background:linear-gradient(160deg,var(--cream-card),#F8F2E4);border:1px solid rgba(212,175,55,0.18);border-radius:14px;padding:18px 20px 16px;box-shadow:0 2px 12px rgba(114,47,55,0.04)}
.ranking-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ranking-title{font-size:1rem;font-weight:700;color:var(--text-heading);letter-spacing:1px;margin:0}
.ranking-title .rank-mode-label{color:var(--gold-dark);font-weight:600}
.rank-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rank-group-label{font-family:'Cinzel',serif;font-size:0.66rem;color:var(--gold-dark);letter-spacing:1.4px;text-transform:uppercase;font-weight:700;padding:0 4px;display:inline-flex;align-items:center;white-space:nowrap}
.rank-group-label::before{content:'';display:inline-block;width:1px;height:14px;background:rgba(139,105,20,0.35);margin-right:10px}
.rank-tab{background:var(--cream);border:1px solid var(--border-gold);border-radius:18px;padding:5px 12px;font-family:var(--font-thai);font-size:0.74rem;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all 0.18s ease;letter-spacing:.3px}
.rank-tab:hover{border-color:var(--gold);color:var(--maroon)}
.rank-tab.active{background:linear-gradient(135deg,#722F37,#8B2252,#D4AF37);color:#FFF5E1;border-color:transparent;box-shadow:0 2px 8px rgba(139,34,82,0.25)}
.ranking-chart-container{position:relative;width:100%;min-height:340px;height:50vw;max-height:440px}
@media(max-width:600px){.ranking-wrap{padding:14px 12px 4px}.ranking-inner{padding:14px 12px 12px}.ranking-title{font-size:0.88rem}.rank-tab{padding:5px 10px;font-size:0.7rem}}
.status-inner{max-width:1400px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap}
.status-chip{display:flex;align-items:center;gap:7px;padding:5px 14px;background:var(--cream-card);border:1px solid var(--border-gold);border-radius:18px;font-size:0.73rem;color:var(--text-muted)}
.status-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.main-wrap{background:var(--cream);padding:0 24px 30px}
.main-inner{max-width:1400px;margin:0 auto}
.loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:20px}
.owl-loader-stage{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.owl-loader-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(46,159,95,0.3)) drop-shadow(0 0 14px rgba(212,175,55,0.25))}
.owl-loader-ring-bg{fill:none;stroke:rgba(139,105,20,0.25);stroke-width:8}
.owl-loader-ring-fg{fill:none;stroke:url(#owlRingGrad);stroke-width:8;stroke-linecap:round;stroke-dasharray:565.48;stroke-dashoffset:565.48;transition:stroke-dashoffset 0.35s cubic-bezier(0.4,0,0.2,1)}
.owl-loader-img{width:100px;height:100px;object-fit:contain;animation:owlFloat 2.8s ease-in-out infinite;filter:drop-shadow(0 4px 12px rgba(46,159,95,0.25)) drop-shadow(0 2px 8px rgba(212,175,55,0.3));margin-top:-22px}
@keyframes owlFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.owl-loader-text{font-family:var(--font-label);font-size:0.95rem;font-weight:700;color:var(--gold-dark);letter-spacing:3px;text-align:center;text-transform:uppercase}
.owl-loader-pct{font-family:var(--font-number);font-size:1.75rem;font-weight:400;color:var(--maroon);letter-spacing:0;position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);text-shadow:0 1px 6px rgba(255,254,248,0.8)}
.loader-dots-left,.loader-dots-right{display:inline-block;color:var(--green);animation:loaderDotsBlink 1.4s ease-in-out infinite;letter-spacing:2px;font-weight:700}
.loader-dots-right{animation-delay:0.7s}
@keyframes loaderDotsBlink{0%,100%{opacity:0.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.summary-card{background:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 55%,#F5EDD8 100%);border:1.5px solid rgba(212,175,55,0.45);border-radius:12px;padding:14px 14px 18px;transition:all 0.3s ease;box-shadow:0 4px 14px rgba(114,47,55,0.08),0 1px 4px rgba(114,47,55,0.05),inset 0 0 0 1px rgba(255,255,255,0.6);position:relative;overflow:hidden;min-height:118px}
.summary-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:75%;background:linear-gradient(180deg,transparent 0%,rgba(245,237,216,0.15) 100%);pointer-events:none;border-radius:0 0 12px 12px;z-index:0}
.summary-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:72px;pointer-events:none;z-index:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 70' xmlns='http://www.w3.org/2000/svg' preserveAspectRatio='none'%3E%3Cpath d='M0,55 C20,50 40,40 70,35 C100,30 130,38 160,30 C180,25 195,32 200,28 L200,70 L0,70 Z' fill='rgba(218,195,148,0.15)'/%3E%3Cpath d='M0,60 C30,52 60,45 100,40 C140,35 170,42 200,36 L200,70 L0,70 Z' fill='rgba(232,220,192,0.25)'/%3E%3Cpath d='M0,45 C25,42 50,30 80,28 C110,26 140,35 170,22 C190,15 200,20 200,18 L200,70 L0,70 Z' fill='rgba(212,175,55,0.06)'/%3E%3Cpath d='M0,40 Q50,25 100,30 Q150,35 200,20' fill='none' stroke='rgba(184,134,11,0.11)' stroke-width='1'/%3E%3Cpath d='M0,50 Q60,38 120,42 Q180,46 200,35' fill='none' stroke='rgba(184,134,11,0.08)' stroke-width='0.7'/%3E%3C/svg%3E");background-size:100% 100%;border-radius:0 0 12px 12px}
.summary-card>*{position:relative;z-index:1}
.summary-card:hover{border-color:rgba(212,175,55,0.7);box-shadow:0 6px 20px rgba(114,47,55,0.12),0 2px 6px rgba(114,47,55,0.08),inset 0 0 0 1px rgba(255,255,255,0.7);transform:translateY(-1px)}
.sc-label{font-family:'Cinzel','Anuphan',serif;font-size:.65rem;font-weight:600;color:#8B6914;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.sc-value{font-family:'DM Serif Display','Sarabun',serif;font-size:1.6rem;font-weight:400;color:#5A3D20;line-height:1.15;letter-spacing:-0.01em;margin-bottom:6px}
.sc-value.positive{color:#2E9F5F}
.sc-value.negative{color:#C14545}
.sc-value.neutral{color:#8B6914}
.sc-desc{font-family:'Sarabun','Anuphan',sans-serif;font-size:.72rem;color:#7A6F62;line-height:1.5}
.sc-desc strong{color:#5A3D20;font-weight:700}
.chart-section{background:linear-gradient(160deg,var(--cream-card),#F8F2E4);border:1px solid rgba(212,175,55,0.15);border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(114,47,55,0.04)}
.chart-section h2{font-size:1rem;font-weight:700;color:var(--text-heading);letter-spacing:1px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.chart-section h2 .icon{width:24px;height:24px;background:var(--gold-dim);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.8rem}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.chart-container{position:relative;width:100%;min-height:280px;height:40vw;max-height:400px}
.table-section{background:linear-gradient(160deg,var(--cream-card),#F8F2E4);border:1px solid rgba(212,175,55,0.15);border-radius:14px;padding:24px;margin-bottom:20px;overflow-x:auto;box-shadow:0 2px 12px rgba(114,47,55,0.04)}
.table-section h2{font-size:1rem;font-weight:700;color:var(--text-heading);letter-spacing:1px;margin-bottom:6px}
.table-section .table-sub{font-size:0.72rem;color:var(--text-muted);margin-bottom:16px}
.controls-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-input-wrap{position:relative;display:inline-flex;align-items:center;width:200px}
.search-input-icon{position:absolute;left:11px;width:14px;height:14px;color:var(--gold-dark);pointer-events:none;flex-shrink:0}
.search-input-wrap input[type="text"]{padding-left:32px !important;width:100% !important}
.controls-row input[type="text"]{background:var(--cream);border:1px solid var(--border-gold);border-radius:8px;padding:8px 14px;color:var(--text-dark);font-family:var(--font-thai);font-size:0.8rem;outline:none;width:200px;transition:border-color 0.3s}
.controls-row input[type="text"]::placeholder{color:var(--text-muted)}
.controls-row input[type="text"]:focus{border-color:var(--gold)}
.controls-row select{background:var(--cream);border:1px solid var(--border-gold);border-radius:8px;padding:8px 14px;color:var(--text-dark);font-family:var(--font-thai);font-size:0.8rem;outline:none;cursor:pointer}
.controls-row select:focus{border-color:var(--gold)}

/* ===== CUSTOM PICKER (cream-themed, replaces native select for Sector + Sub-Industry) ===== */
.cust-picker-trigger{background:var(--cream);border:1px solid var(--border-gold);border-radius:8px;padding:8px 12px;color:var(--text-dark);font-family:var(--font-thai);font-size:0.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-width:170px;max-width:240px;transition:border-color .2s;outline:none}
.cust-picker-trigger:hover, .cust-picker-trigger:focus{border-color:var(--gold)}
.cpt-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.cpt-chev{width:14px;height:14px;color:var(--gold-dark);flex-shrink:0;transition:transform .2s}

.cust-picker-overlay{position:fixed;inset:0;background:rgba(26,10,14,0.55);z-index:9999;display:none;align-items:flex-end;justify-content:center}
.cust-picker-overlay.show{display:flex}
.cust-picker-sheet{background:linear-gradient(180deg,#FFFEF8 0%,#FAF6ED 100%);border-top-left-radius:18px;border-top-right-radius:18px;width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column;border:1.5px solid rgba(212,175,55,0.40);border-bottom:none;box-shadow:0 -4px 28px rgba(26,10,14,0.32);animation:cpSlideUp .25s ease}
@keyframes cpSlideUp{from{transform:translateY(20px);opacity:.6}to{transform:translateY(0);opacity:1}}
.cp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 12px;border-bottom:1px solid rgba(212,175,55,0.25);background:linear-gradient(180deg,rgba(244,228,186,0.22),transparent);border-radius:18px 18px 0 0}
.cp-title{font-family:'Cinzel','Anuphan',serif;font-size:0.78rem;font-weight:700;color:#5A3D20;letter-spacing:1.6px;text-transform:uppercase}
.cp-close{background:rgba(114,47,55,0.08);border:none;width:34px;height:34px;border-radius:50%;color:#722F37;cursor:pointer;font-size:1.45rem;line-height:1;font-weight:300;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.cp-close:hover{background:rgba(114,47,55,0.18)}
.cp-body{overflow-y:auto;flex:1;padding:6px 0 22px}
.cp-option{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 18px;background:transparent;border:none;font-family:'Anuphan',sans-serif;font-size:0.92rem;color:#3D3228;text-align:left;cursor:pointer;border-bottom:1px solid rgba(212,175,55,0.06);transition:background .12s}
.cp-option:hover{background:rgba(212,175,55,0.08)}
.cp-option:active{background:rgba(212,175,55,0.16)}
.cp-option.is-selected{background:rgba(212,175,55,0.13);color:#722F37;font-weight:700}
.cp-option-sub{padding-left:30px;font-size:0.88rem;color:#5A3D20}
.cp-opt-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-opt-count{margin-left:8px;flex-shrink:0;font-family:'DM Serif Display','Sarabun',serif;color:#8B6914;font-size:0.92rem;font-weight:400;letter-spacing:0}
.cp-group-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px 7px;font-family:'Cinzel','Anuphan',serif;font-size:0.7rem;font-weight:700;color:#8B6914;letter-spacing:1.6px;text-transform:uppercase;background:linear-gradient(90deg,rgba(212,175,55,0.13) 0%,rgba(212,175,55,0.02) 100%);border-top:1px solid rgba(212,175,55,0.30);border-left:3px solid #D4AF37;border-right:none;border-bottom:none;margin-top:6px;width:100%;cursor:pointer;text-align:left;font-family:'Cinzel','Anuphan',serif;transition:background .12s}
.cp-group-header:hover{background:linear-gradient(90deg,rgba(212,175,55,0.24) 0%,rgba(212,175,55,0.06) 100%);color:#722F37}
.cp-group-header:active{background:linear-gradient(90deg,rgba(212,175,55,0.32) 0%,rgba(212,175,55,0.10) 100%)}
.cp-group-header.is-selected{background:linear-gradient(90deg,rgba(212,175,55,0.32) 0%,rgba(212,175,55,0.10) 100%);color:#722F37;border-left-width:4px}
.cp-group-header:first-of-type{margin-top:8px}
.cp-group-count{font-family:'DM Serif Display','Sarabun',serif;color:#B8860B;font-size:0.95rem;font-weight:400;letter-spacing:0;text-transform:none}

@media(min-width:601px){
  .cust-picker-overlay{align-items:center;padding:20px}
  .cust-picker-sheet{border-radius:18px;border-bottom:1.5px solid rgba(212,175,55,0.40);max-height:70vh}
  .cp-head{border-radius:16px 16px 0 0}
}
@media(max-width:600px){
  .cust-picker-trigger{min-width:0;flex:1;max-width:100%}
}
table{width:100%;border-collapse:collapse;font-size:0.8rem}
thead th{text-align:left;padding:10px 12px;color:var(--gold-dark);font-weight:600;font-size:0.68rem;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid rgba(212,175,55,0.15);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--maroon)}
thead th.sorted-asc::after{content:' ▲';font-size:0.55rem}thead th.sorted-desc::after{content:' ▼';font-size:0.55rem}
tbody tr{transition:background 0.2s}tbody tr:hover{background:rgba(212,175,55,0.05)}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(212,175,55,0.06);font-size:0.76rem;white-space:nowrap;color:var(--text-dark)}
tbody td.ticker{font-weight:700;color:var(--maroon)}
.scanner-pagination{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;padding:10px 12px;background:linear-gradient(180deg,rgba(255,254,248,0.98),rgba(255,254,248,0.95));border:1px solid var(--border-gold);border-radius:12px;margin-top:14px;box-shadow:0 3px 12px rgba(114,47,55,0.08)}
.scnr-info{font-family:var(--font-thai);font-size:0.72rem;color:var(--text-muted);margin-right:auto;padding-left:6px;letter-spacing:0.02em}
.scnr-info strong{color:var(--maroon);font-weight:700}
.scnr-btn{min-width:32px;height:32px;padding:0 8px;background:var(--cream-card);border:1px solid var(--border-gold);border-radius:7px;font-family:var(--font-number),'Sarabun',serif;font-size:0.88rem;font-weight:400;color:var(--text-dark);cursor:pointer;transition:all 0.15s ease;display:inline-flex;align-items:center;justify-content:center}
.scnr-btn:hover:not(:disabled):not(.active){background:rgba(212,175,55,0.12);color:var(--maroon)}
.scnr-btn:active:not(:disabled){transform:scale(0.93)}
.scnr-btn.active{background:linear-gradient(135deg,#722F37,#8B2252,#D4AF37);color:#FFF5E1;border-color:transparent;box-shadow:0 2px 8px rgba(139,34,82,0.3);font-weight:500}
.scnr-btn.nav{font-family:var(--font-thai);font-weight:700;color:var(--gold-dark)}
.scnr-btn:disabled{opacity:0.35;cursor:not-allowed}
.scnr-dots{color:var(--text-muted);padding:0 4px;font-size:0.9rem;display:inline-flex;align-items:flex-end}
@media (max-width:500px){.scanner-pagination{padding:8px;gap:3px}.scnr-info{display:none}.scnr-btn{min-width:28px;height:28px;font-size:0.8rem;padding:0 5px}}
.positive-cell{color:var(--green-dark)}.negative-cell{color:var(--red)}.neutral-cell{color:var(--text-muted)}
.sector-cell{font-size:0.66rem;color:var(--text-muted);max-width:130px;overflow:hidden;text-overflow:ellipsis}
.momentum-bar{display:inline-block;height:5px;border-radius:3px;min-width:4px;max-width:80px;vertical-align:middle;margin-left:6px}
.momentum-bar.pos{background:var(--green);box-shadow:0 0 5px rgba(76,175,80,0.3)}
.momentum-bar.neg{background:var(--red);box-shadow:0 0 5px rgba(229,57,53,0.3)}
.tooltip-note{font-size:0.68rem;color:var(--text-muted);font-style:italic;margin-top:8px}
.footer-sec{text-align:center;padding:40px 24px;position:relative;z-index:2}
.footer-sec .brand{font-weight:700;color:var(--gold);font-size:0.8rem;letter-spacing:0.15em;margin-bottom:6px}
.footer-sec .disc{font-size:0.7rem;color:var(--text-light-muted);line-height:1.7}
@media(max-width:1024px){.metrics-grid{grid-template-columns:repeat(3,1fr)}.chart-container{min-height:240px;height:35vw}}
@media(max-width:768px){.chart-row{grid-template-columns:1fr}.metrics-grid{grid-template-columns:repeat(3,1fr);gap:10px}.summary-card{padding:12px 12px 16px;min-height:108px}.sc-value{font-size:1.3rem}.chart-container{min-height:220px;height:50vw;max-height:350px}.main-wrap{padding:0 12px 20px}.chart-section,.table-section{padding:16px}}

<body>

<section class="sec-dark">
  <div class="header-section">
    <div class="header-badge">S&P 500 Daily Scanner</div>

<div class="ranking-wrap" id="rankingWrap" style="display:none">

        <button class="rank-tab" data-mode="ret3m" onclick="setRankMode('ret3m', this)">3 เดือน</button>

</div>

<div class="main-wrap">
  <div class="main-inner" id="mainContent">
    <div class="loading-overlay">
      <div class="owl-loader-stage">
        <svg class="owl-loader-ring" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="owlRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2E9F5F"/>
              <stop offset="40%" stop-color="#5BC48E"/>
              <stop offset="75%" stop-color="#D4AF37"/>
              <stop offset="100%" stop-color="#8B6914"/>
            </linearGradient>
          </defs>
          <circle class="owl-loader-ring-bg" cx="100" cy="100" r="90"/>
          <circle id="owlLoaderRingFg" class="owl-loader-ring-fg" cx="100" cy="100" r="90"/>
        </svg>
        <img src="jpt-owl-logo.png" alt="JP Trust" class="owl-loader-img">
        <div id="owlLoaderPct" class="owl-loader-pct">0%</div>

    </div>

<div class="gold-line"></div>
<section class="sec-dark">
  <div class="footer-sec">
    <div class="brand">JP TRUST LEARNING</div>

  </div>

<script>
// ====== DATA SOURCE — same pattern as WeeklyMomentumScanner ======
const CLOUD_URL = 'https://raw.githubusercontent.com/jptrustlearning/sp500/main/input_sp500_daily.csv';
const SECTOR_URL = 'https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv';

// Chart.js defaults
Chart.defaults.color = '#7A6F62';
Chart.defaults.borderColor = 'rgba(212,175,55,0.08)';
Chart.defaults.font.family = "'Anuphan', sans-serif";
Chart.defaults.font.size = 11;

let allStockData = {};
let allDates = [];
let chartInstances = {};
let sectorMap = {};       // ticker -> GICS Sector
let subSectorMap = {};    // ticker -> GICS Sub-Industry
let allSectors = [];      // sorted unique sectors
let sectorStockCount = {}; // sector -> count of tickers in this scan
let allSubSectorsByMain = {}; // sector -> [{name, count}] sorted desc by count

function destroyChart(id) {
  if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
}

// Owl loader progress ring (2πr ≈ 565.48 with r=90) — same shape as backtest pages
function updateOwlProgress(pct) {
  const ring = document.getElementById('owlLoaderRingFg');
  const label = document.getElementById('owlLoaderPct');
  if (!ring || !label) return;
  const clamped = Math.max(0, Math.min(100, pct));
  ring.style.strokeDashoffset = 565.48 * (1 - clamped / 100);
  label.textContent = Math.round(clamped) + '%';
}

// Smooth ramp toward a target percent (eases as it approaches the cap)
let _owlRampTimer = null;
function rampOwlTo(target, capOverride) {
  if (_owlRampTimer) clearInterval(_owlRampTimer);
  let cur = parseFloat(document.getElementById('owlLoaderPct')?.textContent) || 0;
  const cap = capOverride != null ? capOverride : target;
  _owlRampTimer = setInterval(() => {
    const gap = cap - cur;
    if (gap <= 0.5) { updateOwlProgress(cap); clearInterval(_owlRampTimer); _owlRampTimer = null; return; }
    cur += Math.max(0.4, gap * 0.08);
    updateOwlProgress(cur);
  }, 90);
}

async function init() {
  try {
    rampOwlTo(35);  // start ramp during initial fetch
    const [res, sectorRes] = await Promise.all([
      fetch(CLOUD_URL),
      fetch(SECTOR_URL).catch(() => null)
    ]);
    if (!res.ok) throw new Error('fetch fail: ' + res.status);
    const csv = await res.text();
    rampOwlTo(65);

    // Parse sector + sub-industry mapping
    if (sectorRes && sectorRes.ok) {
      const sectorCsv = await sectorRes.text();
      const sectorParsed = Papa.parse(sectorCsv.trim(), { header: true, skipEmptyLines: true });
      sectorParsed.data.forEach(row => {
        const sym = (row.Symbol || '').trim();
        const sector = (row['GICS Sector'] || '').trim();
        const subSector = (row['GICS Sub-Industry'] || '').trim();
        if (sym && sector) sectorMap[sym] = sector;
        if (sym && subSector) subSectorMap[sym] = subSector;
      });
      // Handle BRK.B -> BRK-B style differences for both maps
      Object.keys(sectorMap).forEach(k => {
        if (k.includes('.')) sectorMap[k.replace('.', '-')] = sectorMap[k];
      });
      Object.keys(subSectorMap).forEach(k => {
        if (k.includes('.')) subSectorMap[k.replace('.', '-')] = subSectorMap[k];
      });
    }

    rampOwlTo(90);
    processCSV(csv);
    if (_owlRampTimer) { clearInterval(_owlRampTimer); _owlRampTimer = null; }
    updateOwlProgress(100);
  } catch(e) {
    if (_owlRampTimer) { clearInterval(_owlRampTimer); _owlRampTimer = null; }
    console.error(e);
    document.getElementById('mainContent').innerHTML = `
      <div class="loading-overlay">
        <div style="color:var(--red);font-size:1.4rem;margin-bottom:12px;">CONNECT FAILED</div>
        <div style="color:var(--text-secondary);font-size:0.85rem;max-width:500px;text-align:center;line-height:1.8;">
          <div style="margin-bottom:12px;">${e.message}</div>
          <div style="margin-top:16px;padding:14px;background:rgba(212,168,71,0.08);border:1px solid var(--border);border-radius:8px;">
            <div style="color:var(--gold);font-size:0.85rem;font-weight:600;">วิธีแก้: Download ไฟล์ HTML → เปิดใน Chrome โดยตรง</div>
            <div style="color:var(--text-muted);font-size:0.75rem;margin-top:6px;">ไฟล์นี้จะ fetch ข้อมูลจาก GitHub ได้ปกติเมื่อเปิดนอก iframe</div>
          </div>
        </div>
      </div>`;
  }
}

function processCSV(text) {
  const parsed = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
  const rows = parsed.data;
  if (!rows.length) { throw new Error('No data rows'); }

  // Long format: Ticker, Date, Open, High, Low, Close, Volume
  // Group by ticker, collect daily OHLCV
  const tickerMap = {};
  const dateSet = new Set();
  rows.forEach(row => {
    const ticker = (row.Ticker || '').trim();
    const date = (row.Date || '').trim();
    const close = parseFloat(row.Close);
    const open = parseFloat(row.Open);
    const high = parseFloat(row.High);
    const low = parseFloat(row.Low);
    const volume = parseFloat(row.Volume);
    if (!ticker || !date || isNaN(close)) return;
    if (!tickerMap[ticker]) tickerMap[ticker] = [];
    tickerMap[ticker].push({ date, open, high, low, close, volume: isNaN(volume) ? 0 : volume });
    dateSet.add(date);
  });

  allDates = [...dateSet].sort();

  // Filter last 3 years
  const latestDate = new Date(allDates[allDates.length - 1]);
  const threeYearsAgo = new Date(latestDate);
  threeYearsAgo.setFullYear(threeYearsAgo.getFullYear() - 3);
  const cutoff = threeYearsAgo.toISOString().slice(0, 10);
  allDates = allDates.filter(d => d >= cutoff);
  const cutoffSet = new Set(allDates);

  // Build per-ticker sorted arrays, filtered to last 3 years
  Object.keys(tickerMap).forEach(t => {
    const filtered = tickerMap[t]
      .filter(d => cutoffSet.has(d.date))
      .sort((a, b) => a.date.localeCompare(b.date));
    if (filtered.length >= 120) {
      allStockData[t] = filtered;
    }
  });

  const validTickers = Object.keys(allStockData);

  // Update status bar
  const latest = allDates[allDates.length - 1];
  const earliest = allDates[0];
  document.getElementById('dateDisplay').textContent = latest;
  document.getElementById('statusBar').innerHTML = `
    <div class="status-chip"><span class="dot"></span> DATA LOADED</div>
    <div class="status-chip">${validTickers.length} หุ้น</div>
    <div class="status-chip">${earliest} → ${latest}</div>
    <div class="status-chip">${allDates.length} วันทำการ</div>
    <div class="status-chip">${rows.length.toLocaleString()} แถวข้อมูล</div>
    <div class="status-chip">${Object.keys(sectorMap).length > 0 ? new Set(Object.values(sectorMap)).size + ' Sectors' : 'No Sector Data'}</div>
  `;
  document.getElementById('statusWrap').style.display = '';

  // Compute metrics for each ticker
  const metrics = computeAllMetrics(validTickers);

  // Build sorted unique sector list + count per sector
  const sectorSet = new Set(metrics.map(m => m.sector));
  allSectors = [...sectorSet].filter(s => s !== 'Unknown').sort();
  if (sectorSet.has('Unknown')) allSectors.push('Unknown');

  sectorStockCount = {};
  metrics.forEach(m => {
    sectorStockCount[m.sector] = (sectorStockCount[m.sector] || 0) + 1;
  });

  // Build sub-industry list grouped by parent sector — sorted DESC by count
  // Format: { sector: [{name, count}, ...] }
  const subCountByMain = {}; // {sector: {sub: count}}
  metrics.forEach(m => {
    if (!m.subSector || m.subSector === 'Unknown') return;
    if (!subCountByMain[m.sector]) subCountByMain[m.sector] = {};
    subCountByMain[m.sector][m.subSector] = (subCountByMain[m.sector][m.subSector] || 0) + 1;
  });
  allSubSectorsByMain = {};
  Object.keys(subCountByMain).forEach(sec => {
    allSubSectorsByMain[sec] = Object.entries(subCountByMain[sec])
      .map(([name, count]) => ({name, count}))
      .sort((a, b) => b.count - a.count); // most stocks first
  });

  renderDashboard(metrics, latest);
}

function computeAllMetrics(tickers) {
  return tickers.map(ticker => {
    const data = allStockData[ticker];
    const n = data.length;
    const latest = data[n - 1].close;
    const prev = data[n - 2] ? data[n - 2].close : latest;

    // 1-day return
    const ret1d = (latest - prev) / prev * 100;

    // 5-day return
    const p5 = n > 5 ? data[n - 6].close : data[0].close;
    const ret5d = (latest - p5) / p5 * 100;

    // 1-month (~21 days)
    const p21 = n > 21 ? data[n - 22].close : data[0].close;
    const ret1m = (latest - p21) / p21 * 100;

    // 3-month (~63 days)
    const p63 = n > 63 ? data[n - 64].close : data[0].close;
    const ret3m = (latest - p63) / p63 * 100;

    // 6-month (~126 days)
    const p126 = n > 126 ? data[n - 127].close : data[0].close;
    const ret6m = (latest - p126) / p126 * 100;

    // 1-year (~252 days)
    const p252 = n > 252 ? data[n - 253].close : data[0].close;
    const ret1y = (latest - p252) / p252 * 100;

    // Volatility (20-day std of daily returns)
    const returns20 = [];
    for (let i = Math.max(1, n - 20); i < n; i++) {
      returns20.push((data[i].close - data[i-1].close) / data[i-1].close);
    }
    const meanR = returns20.reduce((a, b) => a + b, 0) / returns20.length;
    const vol20 = Math.sqrt(returns20.reduce((a, b) => a + (b - meanR) ** 2, 0) / returns20.length) * Math.sqrt(252) * 100;

    // SMA 50
    const sma50 = n >= 50 ? data.slice(n - 50).reduce((a, b) => a + b.close, 0) / 50 : latest;
    // SMA 200
    const sma200 = n >= 200 ? data.slice(n - 200).reduce((a, b) => a + b.close, 0) / 200 : latest;

    // Above SMA flags
    const aboveSma50 = latest > sma50;
    const aboveSma200 = latest > sma200;

    // RSI 14
    let gains = 0, losses = 0;
    for (let i = Math.max(1, n - 14); i < n; i++) {
      const diff = data[i].close - data[i-1].close;
      if (diff > 0) gains += diff; else losses -= diff;
    }
    const rs = losses === 0 ? 100 : gains / losses;
    const rsi = 100 - 100 / (1 + rs);

    // Distance from 52-week high (use actual High prices)
    const yearData = data.slice(Math.max(0, n - 252));
    const high52w = Math.max(...yearData.map(d => d.high || d.close));
    const distFromHigh = (latest - high52w) / high52w * 100;

    // Volume ratio (20d avg vs 50d avg)
    const vol20d = n >= 20 ? data.slice(n-20).reduce((a,b) => a + b.volume, 0) / 20 : 0;
    const vol50d = n >= 50 ? data.slice(n-50).reduce((a,b) => a + b.volume, 0) / 50 : vol20d;
    const volRatio = vol50d > 0 ? vol20d / vol50d : 1;

    // Momentum score (composite)
    const momScore = (ret1m * 0.15 + ret3m * 0.25 + ret6m * 0.35 + ret1y * 0.25);

    // Sector + Sub-Industry lookup
    const sector = sectorMap[ticker] || 'Unknown';
    const subSector = subSectorMap[ticker] || 'Unknown';

    return {
      ticker, latest, ret1d, ret5d, ret1m, ret3m, ret6m, ret1y,
      vol20, sma50, sma200, aboveSma50, aboveSma200, rsi,
      high52w, distFromHigh, momScore, volRatio, sector, subSector
    };
  }).sort((a, b) => b.momScore - a.momScore);
}

function renderDashboard(metrics, latestDate) {
  // Summary stats
  const totalStocks = metrics.length;
  const bullish = metrics.filter(m => m.aboveSma200).length;
  const bearish = totalStocks - bullish;
  const avgRet1d = metrics.reduce((a, b) => a + b.ret1d, 0) / totalStocks;
  const avgMom = metrics.reduce((a, b) => a + b.momScore, 0) / totalStocks;
  const top5 = metrics.slice(0, 5);
  const bottom5 = metrics.slice(-5).reverse();
  const avgRSI = metrics.reduce((a, b) => a + b.rsi, 0) / totalStocks;

  // Distribution of returns
  const retBuckets = { 'ขึ้น > 5%': 0, 'ขึ้น 2-5%': 0, 'ขึ้น 0-2%': 0, 'ลง 0-2%': 0, 'ลง 2-5%': 0, 'ลง > 5%': 0 };
  metrics.forEach(m => {
    const r = m.ret1m;
    if (r > 5) retBuckets['ขึ้น > 5%']++;
    else if (r > 2) retBuckets['ขึ้น 2-5%']++;
    else if (r >= 0) retBuckets['ขึ้น 0-2%']++;
    else if (r > -2) retBuckets['ลง 0-2%']++;
    else if (r > -5) retBuckets['ลง 2-5%']++;
    else retBuckets['ลง > 5%']++;
  });

  document.getElementById('mainContent').innerHTML = `
    <!-- METRIC CARDS -->
    <div class="metrics-grid">
      <div class="summary-card">
        <div class="sc-label">จำนวนหุ้นที่สแกน</div>
        <div class="sc-value">${totalStocks}</div>
        <div class="sc-desc">S&amp;P 500 Universe</div>
      </div>
      <div class="summary-card">
        <div class="sc-label">Breadth (&gt; SMA200)</div>
        <div class="sc-value ${bullish > bearish ? 'positive' : 'negative'}">${bullish} / ${totalStocks}</div>
        <div class="sc-desc"><strong>${(bullish/totalStocks*100).toFixed(1)}%</strong> Bullish</div>
      </div>
      <div class="summary-card">
        <div class="sc-label">ผลตอบแทนเฉลี่ยวันนี้</div>
        <div class="sc-value ${avgRet1d >= 0 ? 'positive' : 'negative'}">${avgRet1d >= 0 ? '+' : ''}${avgRet1d.toFixed(2)}%</div>
        <div class="sc-desc">Equal-weighted Avg</div>
      </div>
      <div class="summary-card">
        <div class="sc-label">AVG RSI (14)</div>
        <div class="sc-value">${avgRSI.toFixed(1)}</div>
        <div class="sc-desc">${avgRSI > 60 ? 'Overbought Zone' : avgRSI < 40 ? 'Oversold Zone' : 'Neutral Zone'}</div>
      </div>
      <div class="summary-card">
        <div class="sc-label">Avg Momentum Score</div>
        <div class="sc-value ${avgMom >= 0 ? 'positive' : 'negative'}">${avgMom >= 0 ? '+' : ''}${avgMom.toFixed(2)}</div>
        <div class="sc-desc">Composite (1M&ndash;1Y weighted)</div>
      </div>
      <div class="summary-card">
        <div class="sc-label">ข้อมูลวันล่าสุด</div>
        <div class="sc-value" style="font-size:1.2rem">${latestDate}</div>
        <div class="sc-desc">ย้อนหลัง 3 ปี</div>
      </div>
    </div>

    <!-- CHARTS ROW 1 -->
    <div class="chart-section">
      <h2>MARKET OVERVIEW</h2>
      <div>
        <div style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:8px;">การกระจายผลตอบแทน 1 เดือน</div>
        <div class="chart-container"><canvas id="chartRetDist"></canvas></div>
      </div>
    </div>

    <!-- CHARTS ROW 2 -->
    <div class="chart-section">
      <h2>MOMENTUM & RISK ANALYSIS</h2>
      <div class="chart-row">
        <div>
          <div style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:8px;">RSI Distribution</div>
          <div class="chart-container"><canvas id="chartRSI"></canvas></div>
        </div>
        <div>
          <div style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:8px;">Momentum vs Volatility (Scatter)</div>
          <div class="chart-container"><canvas id="chartScatter"></canvas></div>
        </div>
      </div>
    </div>

    <!-- CHARTS ROW 3 - sector breadth -->
    <div class="chart-section">
      <h2>PERFORMANCE HEATMAP</h2>
      <div style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:12px;">Top 20 หุ้นที่มี Momentum Score สูงสุด — ผลตอบแทนแต่ละช่วงเวลา</div>
      <div class="chart-container" style="min-height:300px;height:45vw;max-height:500px;"><canvas id="chartHeatBar"></canvas></div>
    </div>

    <!-- TABLE -->
    <div class="table-section">
      <h2>STOCK SCANNER TABLE</h2>
      <div class="table-sub">เรียงตาม Momentum Score · คลิกหัวคอลัมน์เพื่อเรียงข้อมูล</div>
      <div class="controls-row">
        <div class="search-input-wrap">
          <svg class="search-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="ค้นหา Ticker..." oninput="filterTable()">
        </div>
        <select id="filterSMA" onchange="filterTable()">
          <option value="all">ทั้งหมด</option>
          <option value="above200">Above SMA200</option>
          <option value="below200">Below SMA200</option>
          <option value="above50">Above SMA50</option>
          <option value="golden">Golden Cross (50>200)</option>
        </select>
        <select id="filterRSI" onchange="filterTable()">
          <option value="all">RSI ทั้งหมด</option>
          <option value="ob">RSI > 70 (Overbought)</option>
          <option value="os">RSI < 30 (Oversold)</option>
          <option value="neutral">RSI 30-70</option>
        </select>
        <button type="button" class="cust-picker-trigger" id="filterSectorBtn" onclick="openPicker('Sector')">
          <span class="cpt-label" id="filterSectorLabel">อุตสาหกรรมทั้งหมด</span>
          <svg class="cpt-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <input type="hidden" id="filterSector" value="all">
        <button type="button" class="cust-picker-trigger" id="filterSubSectorBtn" onclick="openPicker('SubSector')">
          <span class="cpt-label" id="filterSubSectorLabel">หมวดย่อยทั้งหมด</span>
          <svg class="cpt-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <input type="hidden" id="filterSubSector" value="all">
      </div>
      <div style="overflow-x:auto;">
        <table id="stockTable">
          <thead>
            <tr>
              <th data-col="rank">#</th>
              <th data-col="ticker">Ticker</th>
              <th data-col="sector">Sector</th>
              <th data-col="latest">Price</th>
              <th data-col="ret1d">1D %</th>
              <th data-col="ret5d">5D %</th>

  ret1d:    { label: '1 วัน',          short: '%ผลตอบแทน 1 วัน',         isPercent: true  },

  ret1m:    { label: '1 เดือน',        short: '%ผลตอบแทน 1 เดือน',       isPercent: true  },
  ret3m:    { label: '3 เดือน',        short: '%ผลตอบแทน 3 เดือน',       isPercent: true  }

function setRankMode(mode, btn) {
  if (!RANK_MODE_META[mode]) return;
  rankingState.mode = mode;
  document.querySelectorAll('#rankTabs .rank-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderRankingChart();
}

function renderRankingChart() {
  const { metrics, mode } = rankingState;
  if (!metrics || !metrics.length) return;
  const meta = RANK_MODE_META[mode];

  // Re-rank by current mode (filter NaN/null), pick top 5 + bottom 5
  const valid = metrics.filter(m => typeof m[mode] === 'number' && !isNaN(m[mode]));
  const sorted = [...valid].sort((a, b) => b[mode] - a[mode]);
  const top5 = sorted.slice(0, 5);
  const bottom5 = sorted.slice(-5);
  // Display order: top first (high to low), then bottom (high to low among bottom)
  const combined = [...top5, ...bottom5];

  document.getElementById('rankModeLabel').textContent = meta.short;

  destroyChart('chartTopBottom');
  const ctxTB = document.getElementById('chartTopBottom').getContext('2d');
  const fmt = v => meta.isPercent ? (v >= 0 ? '+' : '') + v.toFixed(2) + '%' : v.toFixed(2);
  chartInstances['chartTopBottom'] = new Chart(ctxTB, {
    type: 'bar',
    data: {
      labels: combined.map(m => m.ticker),
      datasets: [{
        label: meta.short,
        data: combined.map(m => m[mode]),
        backgroundColor: combined.map(m => m[mode] >= 0 ? 'rgba(76,175,80,0.75)' : 'rgba(239,83,80,0.75)'),

        borderSkipped: false

      indexAxis: 'y',

      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a0a0e', titleColor: '#D4A847', bodyColor: '#F5DEB3',
          borderColor: '#D4A847', borderWidth: 1,

// TABLE
let currentMetrics = [];
let sortCol = 'momScore';
let sortDir = 'desc';
const SCANNER_PAGE_SIZE = 15;
let _scannerPage = 1;

function populateTable(metrics) {
  currentMetrics = [...metrics];
  _scannerPage = 1;
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const search = (document.getElementById('searchInput')?.value || '').toUpperCase();
  const smaFilter = document.getElementById('filterSMA')?.value || 'all';
  const rsiFilter = document.getElementById('filterRSI')?.value || 'all';
  const sectorFilter = document.getElementById('filterSector')?.value || 'all';
  const subSectorFilter = document.getElementById('filterSubSector')?.value || 'all';

  let filtered = currentMetrics.filter(m => {
    if (search && !m.ticker.includes(search)) return false;
    if (smaFilter === 'above200' && !m.aboveSma200) return false;
    if (smaFilter === 'below200' && m.aboveSma200) return false;
    if (smaFilter === 'above50' && !m.aboveSma50) return false;
    if (smaFilter === 'golden' && !(m.sma50 > m.sma200)) return false;
    if (rsiFilter === 'ob' && m.rsi <= 70) return false;
    if (rsiFilter === 'os' && m.rsi >= 30) return false;
    if (rsiFilter === 'neutral' && (m.rsi < 30 || m.rsi > 70)) return false;
    if (sectorFilter !== 'all' && m.sector !== sectorFilter) return false;
    if (subSectorFilter !== 'all' && m.subSector !== subSectorFilter) return false;
    return true;
  });

  // Sort
  filtered.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (sortDir === 'asc') return va > vb ? 1 : va < vb ? -1 : 0;
    return va < vb ? 1 : va > vb ? -1 : 0;
  });

  // Pagination — slice to current page
  const totalPages = Math.max(1, Math.ceil(filtered.length / SCANNER_PAGE_SIZE));
  if (_scannerPage > totalPages) _scannerPage = totalPages;
  if (_scannerPage < 1) _scannerPage = 1;
  const page = _scannerPage;
  const startIdx = (page - 1) * SCANNER_PAGE_SIZE;
  const pageRecords = filtered.slice(startIdx, startIdx + SCANNER_PAGE_SIZE);

  tbody.innerHTML = pageRecords.map((m, i) => {
    const fmtPct = (v) => {
      const cls = v >= 0 ? 'positive-cell' : 'negative-cell';
      return `<td class="${cls}">${v >= 0 ? '+' : ''}${v.toFixed(2)}%</td>`;
    };
    const momW = Math.min(Math.abs(m.momScore) * 1.2, 80);
    const momCls = m.momScore >= 0 ? 'pos' : 'neg';
    return `<tr>
      <td>${startIdx + i + 1}</td>
      <td class="ticker">${m.ticker}</td>
      <td class="sector-cell">${m.sector}</td>
      <td>$${m.latest.toFixed(2)}</td>
      ${fmtPct(m.ret1d)}
      ${fmtPct(m.ret5d)}
      ${fmtPct(m.ret1m)}
      ${fmtPct(m.ret3m)}
      ${fmtPct(m.ret6m)}
      ${fmtPct(m.ret1y)}
      <td class="${m.rsi > 70 ? 'positive-cell' : m.rsi < 30 ? 'negative-cell' : 'neutral-cell'}">${m.rsi.toFixed(1)}</td>
      <td>${m.vol20.toFixed(1)}%</td>
      <td class="${m.volRatio >= 1.2 ? 'positive-cell' : m.volRatio <= 0.8 ? 'negative-cell' : 'neutral-cell'}">${m.volRatio.toFixed(2)}x</td>
      <td class="negative-cell">${m.distFromHigh.toFixed(1)}%</td>
      <td class="${m.momScore >= 0 ? 'positive-cell' : 'negative-cell'}">
        ${m.momScore >= 0 ? '+' : ''}${m.momScore.toFixed(2)}
        <span class="momentum-bar ${momCls}" style="width:${momW}px"></span>
      </td>
    </tr>`;
  }).join('');

  // Render pagination bar
  const pagBar = document.getElementById('paginationBar');
  if (!pagBar) return;
  if (totalPages <= 1) { pagBar.style.display = 'none'; pagBar.innerHTML = ''; return; }
  pagBar.style.display = '';
  let html = `<div class="scnr-info"><strong>${filtered.length}</strong> หุ้น · หน้า <strong>${page}</strong>/${totalPages}</div>`;
  html += `<button class="scnr-btn nav" onclick="gotoScannerPage(1)" ${page===1?'disabled':''}>«</button>`;
  html += `<button class="scnr-btn nav" onclick="gotoScannerPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
  const pages = [];
  pages.push(1);
  if (page > 3) pages.push('...');
  for (let p = Math.max(2, page-1); p <= Math.min(totalPages-1, page+1); p++) pages.push(p);
  if (page < totalPages - 2) pages.push('...');
  if (totalPages > 1) pages.push(totalPages);
  pages.forEach(p => {
    if (p === '...') html += `<span class="scnr-dots">…</span>`;
    else html += `<button class="scnr-btn ${p===page?'active':''}" onclick="gotoScannerPage(${p})">${p}</button>`;
  });
  html += `<button class="scnr-btn nav" onclick="gotoScannerPage(${page+1})" ${page===totalPages?'disabled':''}>›</button>`;
  html += `<button class="scnr-btn nav" onclick="gotoScannerPage(${totalPages})" ${page===totalPages?'disabled':''}>»</button>`;
  pagBar.innerHTML = html;
}

window.gotoScannerPage = function(p) {
  _scannerPage = p;
  renderTable();
  const tbl = document.getElementById('stockTable');
  if (tbl) tbl.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

function filterTable() { _scannerPage = 1; renderTable(); }

// Cascading: when sector picked, rebuild sub-filter to that sector's sub-industries only.
// Sub-industries sorted DESC by stock count (most stocks first), counts shown.
// 'all' restores full grouped list.
function onSectorChange() {
  const sectorVal = document.getElementById('filterSector').value;
  const subSel = document.getElementById('filterSubSector');
  if (!subSel) { filterTable(); return; }
  let optionsHtml = '<option value="all">หมวดย่อยทั้งหมด</option>';
  if (sectorVal === 'all') {
    optionsHtml += Object.keys(allSubSectorsByMain).sort().map(sec =>
      `<optgroup label="${sec} (${sectorStockCount[sec]||0})">${allSubSectorsByMain[sec].map(sub => `<option value="${sub.name}">${sub.name} (${sub.count})</option>`).join('')}</optgroup>`
    ).join('');
  } else if (allSubSectorsByMain[sectorVal]) {
    optionsHtml += allSubSectorsByMain[sectorVal].map(sub => `<option value="${sub.name}">${sub.name} (${sub.count})</option>`).join('');
  }
  subSel.innerHTML = optionsHtml;
  subSel.value = 'all';
  filterTable();
}

function setupTableSort(metrics) {
  document.querySelectorAll('#stockTable thead th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (!col) return;
      if (sortCol === col) sortDir = sortDir === 'desc' ? 'asc' : 'desc';
      else { sortCol = col; sortDir = 'desc'; }
      document.querySelectorAll('#stockTable thead th').forEach(t => t.classList.remove('sorted-asc', 'sorted-desc'));
      th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
      _scannerPage = 1;
      renderTable();
    });
  });
}

const PICKER_STATE = {
  Sector:    { value: 'all', label: 'อุตสาหกรรมทั้งหมด', title: 'อุตสาหกรรมหลัก' },
  SubSector: { value: 'all', label: 'หมวดย่อยทั้งหมด',   title: 'หมวดอุตสาหกรรมย่อย' }

function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
}
function escapeText(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildSectorBody(){
  const sel = PICKER_STATE.Sector.value;
  const totalCount = (typeof currentMetrics !== 'undefined' && currentMetrics) ? currentMetrics.length : '';
  let h = `<button class="cp-option ${sel==='all'?'is-selected':''}" data-v="all" data-l="อุตสาหกรรมทั้งหมด">
    <span class="cp-opt-text">อุตสาหกรรมทั้งหมด</span>
    <span class="cp-opt-count">${totalCount}</span>
  </button>`;
  allSectors.forEach(s => {
    const cnt = sectorStockCount[s]||0;
    const lbl = `${s} (${cnt})`;
    h += `<button class="cp-option ${sel===s?'is-selected':''}" data-v="${escapeAttr(s)}" data-l="${escapeAttr(lbl)}">
      <span class="cp-opt-text">${escapeText(s)}</span>
      <span class="cp-opt-count">${cnt}</span>
    </button>`;
  });
  return h;
}

function buildSubBody(){
  const sectorVal = PICKER_STATE.Sector.value;
  const sel = PICKER_STATE.SubSector.value;
  let h = `<button class="cp-option ${sel==='all'?'is-selected':''}" data-v="all" data-l="หมวดย่อยทั้งหมด">
    <span class="cp-opt-text">หมวดย่อยทั้งหมด</span>
  </button>`;

        <span>${escapeText(sec)}</span><span class="cp-group-count">${secCnt}</span>
      </button>`;
      allSubSectorsByMain[sec].forEach(sub => {
        const lbl = `${sub.name} (${sub.count})`;
        h += `<button class="cp-option cp-option-sub ${sel===sub.name?'is-selected':''}" data-v="${escapeAttr(sub.name)}" data-l="${escapeAttr(lbl)}">
          <span class="cp-opt-text">${escapeText(sub.name)}</span>

function openPicker(which){
  const overlay = document.getElementById('cpOverlay');
  const body = document.getElementById('cpBody');
  const title = document.getElementById('cpTitle');
  if (!overlay || !body || !title) return;
  title.textContent = PICKER_STATE[which].title;
  body.innerHTML = which==='Sector' ? buildSectorBody() : buildSubBody();
  overlay.dataset.which = which;
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
  // Wire option click handlers
  body.querySelectorAll('.cp-option').forEach(btn => {
    btn.addEventListener('click', () => {
      selectOption(which, btn.dataset.v, btn.dataset.l);
    });
  });
  // Wire group-header clicks (only present in Sub picker when sector='all')
  body.querySelectorAll('.cp-group-header').forEach(btn => {
    btn.addEventListener('click', () => {
      pickMainFromSubPicker(btn.dataset.sector);
    });
  });
  // Scroll to selected (if any)
  setTimeout(() => {
    const selEl = body.querySelector('.cp-option.is-selected');
    if (selEl) selEl.scrollIntoView({block:'center', behavior:'auto'});
  }, 30);
}

function closePicker(){
  const overlay = document.getElementById('cpOverlay');
  if (!overlay) return;
  overlay.classList.remove('show');
  document.body.style.overflow = '';
}

function selectOption(which, value, label){
  PICKER_STATE[which].value = value;
  PICKER_STATE[which].label = label;
  const hidden = document.getElementById('filter'+which);
  const btnLbl = document.getElementById('filter'+which+'Label');
  if (hidden) hidden.value = value;
  if (btnLbl) btnLbl.textContent = label;
  // Cascading: when sector changes, reset sub-filter
  if (which === 'Sector') {
    PICKER_STATE.SubSector.value = 'all';
    PICKER_STATE.SubSector.label = 'หมวดย่อยทั้งหมด';
    const subH = document.getElementById('filterSubSector');
    const subL = document.getElementById('filterSubSectorLabel');
    if (subH) subH.value = 'all';
    if (subL) subL.textContent = 'หมวดย่อยทั้งหมด';
  }
  closePicker();
  filterTable();
}

// Click a group header (parent sector) inside the Sub picker → filter by that
// main sector with sub reset to 'all'. Quick shortcut so user doesn't have to
// open the separate Sector picker just to filter by an entire group.
function pickMainFromSubPicker(sectorName){
  if (!sectorName) return;
  const cnt = sectorStockCount[sectorName] || 0;
  PICKER_STATE.Sector.value = sectorName;
  PICKER_STATE.Sector.label = `${sectorName} (${cnt})`;
  PICKER_STATE.SubSector.value = 'all';
  PICKER_STATE.SubSector.label = 'หมวดย่อยทั้งหมด';
  // Sync hidden inputs + button labels
  const secH = document.getElementById('filterSector');
  const secL = document.getElementById('filterSectorLabel');
  const subH = document.getElementById('filterSubSector');
  const subL = document.getElementById('filterSubSectorLabel');
  if (secH) secH.value = sectorName;
  if (secL) secL.textContent = PICKER_STATE.Sector.label;
  if (subH) subH.value = 'all';
  if (subL) subL.textContent = 'หมวดย่อยทั้งหมด';
  closePicker();
  filterTable();
}

// Backdrop click + ESC close
document.addEventListener('click', e => {
  const overlay = document.getElementById('cpOverlay');
  if (overlay && e.target === overlay) closePicker();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePicker();
});

// INIT
init();
</script>

<!-- ===== Custom Picker Overlay (shared by Sector + Sub-Industry) ===== -->
<div class="cust-picker-overlay" id="cpOverlay" role="dialog" aria-modal="true">
  <div class="cust-picker-sheet">
    <div class="cp-head">
      <span class="cp-title" id="cpTitle"></span>
      <button class="cp-close" type="button" onclick="closePicker()" aria-label="ปิด">×</button>
    </div>
    <div class="cp-body" id="cpBody"></div>
  </div>
</div>
</body>
</html>
